<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fazenda Mourão</title>
<meta name="theme-color" content="#24452f">
<style>
/* Layout: app de campo, uma coluna, barra de abas fixa embaixo, botões grandes para usar com o polegar */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --ink:#1d2a20; --muted:#5e6b60; --line:#d7ddd2;
  --brand:#24452f; --brand-ink:#ffffff; --accent:#b8860b;
  --ok:#2f7d3a; --warn:#b26b00; --bad:#b3261e; --info:#2b5f8a;
  --ok-bg:#e3f1e2; --warn-bg:#fbefd9; --bad-bg:#f9e1df; --info-bg:#e1ecf5;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121813; --surface:#1b231d; --ink:#e6ece4; --muted:#9daa9e; --line:#2f3a31;
  --brand:#3d6b4a; --brand-ink:#ffffff; --accent:#e0b04a;
  --ok:#7cc285; --warn:#e6a94a; --bad:#f08a80; --info:#8bb8de;
  --ok-bg:#1f3322; --warn-bg:#3a2d14; --bad-bg:#3d1f1c; --info-bg:#1b2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1b231d; --ink:#e6ece4; --muted:#9daa9e; --line:#2f3a31;
  --brand:#3d6b4a; --brand-ink:#ffffff; --accent:#e0b04a;
  --ok:#7cc285; --warn:#e6a94a; --bad:#f08a80; --info:#8bb8de;
  --ok-bg:#1f3322; --warn-bg:#3a2d14; --bad-bg:#3d1f1c; --info-bg:#1b2c3b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header.top h1{margin:0;font:700 clamp(13.5px,4.1vw,19px)/1.1 var(--display);letter-spacing:.01em;white-space:nowrap}
header.top small{opacity:.85;font-size:12px}
main{padding:14px 16px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr .9fr 1.45fr 1.3fr .95fr .9fr;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 1px 10px;color:var(--muted);font:600 11px var(--font);letter-spacing:-.1px;white-space:nowrap;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
@media (max-width:380px){nav.tabs button{font-size:9.5px;letter-spacing:-.2px}}
@media (max-width:400px){nav.tabs button svg{width:20px;height:20px}}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--brand)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ok)}}
h2{font:700 18px/1.2 var(--display);margin:4px 0 10px;text-wrap:balance}
h3{font:700 15px/1.2 var(--font);margin:16px 0 8px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;font:16px var(--font);padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{padding:11px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:700 16px var(--font);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:700 15px var(--font);cursor:pointer}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.summary button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 6px;text-align:left;cursor:pointer}
.summary b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.summary span{font-size:11.5px;color:var(--muted)}
.summary button[aria-pressed="true"]{outline:2px solid var(--brand)}
.plist{display:flex;flex-direction:column;gap:6px}
.p{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px 9px 0;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.p .stripe{align-self:stretch;border-radius:9px 0 0 9px}
.p .nm{font:700 16px var(--display)}
.p .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.p .rt{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.bar{width:74px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-left:auto;margin-top:4px}
.bar i{display:block;height:100%}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin:2px 4px 0 0}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)}
.note{border-radius:9px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ink);border:1px solid var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ink);border-radius:8px;padding:6px 9px;font:600 13px var(--font);cursor:pointer;text-align:left}
.menu{display:grid;gap:8px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 15px var(--font);cursor:pointer;text-align:left}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.menu .badge{font:700 13px var(--font);padding:2px 9px;border-radius:999px}
.vizpick{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:8px}
.vizpick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:600 13px var(--font);cursor:pointer}
.vizpick button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.tiles b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.tiles span{font-size:12px;color:var(--muted)}
td.num,th.num{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:9;max-width:90vw}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.p,.btn{transition:transform .08s}.p:active,.btn:active{transform:scale(.99)}}
[hidden]{display:none!important}
header.top{align-items:center}
.pend summary{cursor:pointer;font-size:15px}.plist2{margin-top:8px;display:flex;flex-direction:column}.pl{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}.pli{flex:0 0 22px;text-align:center}.plt{flex:1}.pl a{font-weight:600;white-space:nowrap}.pla{display:flex;gap:6px}.pla .btn{padding:6px 10px;min-height:0;font-size:13px}
header.top .who{display:block;opacity:.9;font-size:12px;margin-top:2px;background:none;border:0;color:inherit;padding:0;font:600 12px var(--font);cursor:pointer;text-decoration:underline dotted}
.topbtns{display:flex;gap:6px}
.topbtns button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--brand-ink);border-radius:8px;padding:5px 8px;font:600 11px var(--font);cursor:pointer}
.topbtns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.topbtns .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;font:700 11px/18px var(--font);background:var(--accent);color:#1d2a20}
.topbtns .dot.bad{background:#f08a80}
#login{max-width:420px;margin:0 auto;padding:40px 16px}
#login h1{font:700 26px var(--display);color:var(--brand);margin:0 0 4px}
:root[data-theme="dark"] #login h1{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #login h1{color:var(--ok)}}
.dia{font:700 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.pc{display:grid;grid-template-columns:5px minmax(0,1fr) minmax(0,1.25fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink);font:inherit;padding:0;width:100%;font-size:13px}
.pc .stripe{grid-row:1/3}
.pcL,.pcR{padding:9px 10px;min-width:0}
.pcR{border-left:1px dashed var(--line)}
.pc .nm{font:700 16px var(--display)}
.pc .sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pc .br{display:grid;grid-template-columns:54px 1fr 30px;align-items:center;gap:6px;margin:3px 0;font-size:12.5px}
.pc .br b{text-align:right;font-variant-numeric:tabular-nums}
.pc .bar{width:auto;margin:0}
.pc .lt{font:700 14px var(--font)}
.pc .ct{margin-top:3px;font-size:12.5px}
.pc hr{border:0;border-top:1px solid var(--line);margin:7px 0}
.pcA{grid-column:2/4;padding:4px 10px 8px;border-top:1px solid var(--line)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.qst{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.qst .btn{padding:6px 12px;font-size:18px;line-height:1}
.qst input{width:64px;text-align:center;padding:7px 4px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;background:var(--line)}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--bad);color:#fff;font:700 14px/22px var(--font);cursor:pointer;padding:0}
.lg{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.lg:last-child{border-bottom:0}
.lg time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.lg .t{font-weight:700}
/* ferramentas da tela: letra grande e ajuda */
.ferr{display:flex;justify-content:flex-end;gap:8px;margin:-4px 0 8px}
.ferr button{min-width:40px;height:36px;border-radius:18px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--font);padding:0 12px;cursor:pointer}
#ajudaFundo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
#ajudaBox{background:var(--surface);color:var(--ink);border-radius:14px;max-width:560px;width:100%;max-height:80vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;font-size:15px}
#ajudaBox p{margin:0}
/* modo claro para sol forte: branco puro, preto e cores mais fortes */
:root[data-theme="light"]{--bg:#ffffff;--surface:#ffffff;--ink:#000000;--muted:#2b2b2b;--line:#8a8a8a;--brand:#163a22;--accent:#8a6100;
  --ok:#14621f;--warn:#8a4b00;--bad:#9e1209;--info:#123f6b;--ok-bg:#d3ecd1;--warn-bg:#f8e2b8;--bad-bg:#f6cdc9;--info-bg:#cfe1f2;color-scheme:light}
:root[data-theme="light"] body{font-weight:500}
</style>

// SHA-256 em JS puro (funciona aberto como arquivo, sem internet)
function sha256(msg){const K=[],H=[];let n=2,c=0;const fr=x=>(x-Math.floor(x))*4294967296|0;
  while(c<64){let p=true;for(let i=2;i*i<=n;i++)if(n%i===0){p=false;break}if(p){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c]=fr(Math.pow(n,1/3));c++}n++}
  const b=Array.from(new TextEncoder().encode(msg)),l=b.length*8;b.push(128);while(b.length%64!==56)b.push(0);
  for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const r=(x,k)=>(x>>>k)|(x<<(32-k)),W=new Array(64);
  for(let j=0;j<b.length;j+=64){for(let i=0;i<16;i++)W[i]=(b[j+4*i]<<24)|(b[j+4*i+1]<<16)|(b[j+4*i+2]<<8)|b[j+4*i+3];
    for(let i=16;i<64;i++){const s0=r(W[i-15],7)^r(W[i-15],18)^(W[i-15]>>>3),s1=r(W[i-2],17)^r(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
    let [a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+W[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;
      h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('')}

const DAY=86400000;
const toD=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const iso=t=>new Date(t).toISOString().slice(0,10);

// ---------- gado por pasto ----------
// Cada pasto ocupado tem um grupo de gado: categorias com quantidade, peso (na data de início do trecho) e GMD.

function sexoCats(cats){const c=Object.keys(cats).filter(k=>cats[k].q>0);let s='';if(c.some(x=>MALE.includes(x)))s+='M';if(c.some(x=>FEM.includes(x)))s+='F';return s}

// Pesagem fora das águas guarda o GMD medido (k.m = {g, ate}) até a próxima troca de época.
const GMD_SECA_PAD={'Bezerros':.5,'Desmamas machos':.2,'Desmamas fêmeas':.2,'Desmamas':.2,'Garrotes':.2,'Novilhas':.15,'Bois':.1,'Vacas':0,'Vacas cheias':.1,'Vacas vazias':0,'Vacas descarte':.1,'CEIP':0,'Potros':0,'Tropa':0,'Tropa chucra':0,'Tropa adestrada':0};
const gmdSeca=c=>{const t=S.config.gmdSeca||{};return t[c]!=null?+t[c]:(GMD_SECA_PAD[c]??0)};
const dn=s=>Math.round(toD(s)/DAY);
let _epb=null,_epbK='',_epRef=null;
// trocas de época em número de dia: [[dia, época]] (antes da primeira, águas)
function epTrocas(){const E0=S.config.epocas||[];if(E0!==_epRef||!_epb){const E=epocas();_epb=E.map(x=>[dn(x.data),x.epoca]);_epbK=JSON.stringify(_epb);_epRef=E0}return _epb}

// primeira troca de época depois do dia (data) ou null
function proxTroca(d){const n=dn(d),ep=epN(n);for(const [x,e] of epTrocas())if(x>n&&e!==ep)return iso(x*DAY);return null}

// ganho entre os dias a e b (números) somando os trechos de cada época
function ganhoN(k,c,a,b){if(!(b>a))return 0;if(!c)return k.g*(b-a);const cut=[a];for(const [d] of epTrocas())if(d>a&&d<b)cut.push(d);

// ---------- alertas ----------

      if(e.u<LEVE){const d=dias(e.occ[0].entrada,ref);if(d>=MAXLEVE)add(p.id,'warn',`Gado leve há ${d} dias: trocar e fazer corte`)}
      {const v=[];for(const x of e.occ)for(const k of catsHoje(x,ref))if(dias(k.pes,ref)>DIAS_PESAGEM)v.push(`${k.c.toLowerCase()} (${dias(k.pes,ref)} d)`);if(v.length)add(p.id,'warn',`Pesar: ${v.join(', ')}`)}

      {const x=supAtivo(p.id,PER);if(x){const t=supTxt(x);if(t.tipo!=='info')add(p.id,t.tipo,t.txt)}}
      if(foraEpoca(e.sup,e.ep))add(p.id,'warn',`Suplemento ${e.sup.nome} é para ${USO[e.sup.uso].toLowerCase()}`);
      if(ul&&ul.situacao==='reforma')add(p.id,'bad','Pasto em reforma com gado');
      const sx=e.occ.map(sexo).join('');

function corteAguardando(PER){
  // pastos que tiveram lote leve (<1 UA/ha) por 60 dias ou mais no último período e estão vazios
  const ref=hoje(),set={};
  for(const x of estadas(PER)){if(x.fim===null||!P[x.pasto])continue;const d=dias(x.ini,x.fim);if(d<MAXLEVE)continue;
    const u=uaSeg(x.prim,x.prim.ini)/P[x.pasto].area;if(u>=LEVE)continue;
    if(ocupantes(x.pasto,ref,PER).length)continue;
    const depois=PER.some(y=>y.pasto===x.pasto&&y.ini>=x.fim);if(depois)continue;
    set[x.pasto]=x.fim}
  return set;
}

// mov: categorias que vão ({c:{q,w,g}} com peso na data); resto: o que fica no pasto de saída; outros: destinos já escolhidos
function sugerir(mov,de,resto,data,PER,outros){
  let U=0;for(const k of Object.values(mov))U+=k.q*k.w;U/=450;
  const sx=sexoCats(mov),sxResto=sexoCats(resto),corte=corteAguardando(PER),out=[],ideal=EP(epocaEm(data)).ideal;
  if(U<=0)return out;
  for(const p of PASTOS){
    if(p.naoRecebe||p.id===de||(outros||[]).includes(p.id))continue;
    if(ocupantes(p.id,data,PER).length)continue;
    const ul=ultimaLeitura(p.id);
    if(ul&&(ul.situacao==='reforma'||ul.agua==='seca'))continue;
    if(p.semAguaSeca&&epocaEm(data)==='seca')continue;
    const e=estado(p.id,PER,data);
    if(e.adubo&&e.adubo.libera>data)continue;
    if(e.passado&&!temVacasCats(mov))continue;
    const emCorte=p.id in corte;
    if(!e.pronto&&!emCorte&&!e.semLeit)continue;
    if(p.viz.some(v=>choca(sx,v===de?sxResto:ocupantes(v,data,PER).map(sexo).join(''))))continue;
    const uh=U/p.area;
    if(emCorte&&uh<=PESADO)continue;
    const q=C*uh-e.r.g, dur=q>0?(e.alt-CP().sairAlt)/q:Infinity;
    const mesmoBloco=p.id.split(/[.\s]/)[0]===de.split(/[.\s]/)[0],viz=!!(P[de]&&P[de].viz.includes(p.id));
    const prox=viz?0:mesmoBloco?1:2,dif=Math.abs(uh-ideal);
    const ep=erroPrev(p.id);out.push({id:p.id,uh,dur,emCorte,passado:e.passado,semLeit:e.semLeit,pouco:!!(ep&&ep.ruim),prox,dif,ideal});
  }
  // pasto sem leitura sempre por último; corte rápido primeiro; com vacas, o passado vem antes; depois a lotação mais perto da ideal (faixas de 0,5 UA/ha), a proximidade e a diferença exata
  const vacas=temVacasCats(mov),k=x=>[x.semLeit?1:0,x.pouco?1:0,x.emCorte?0:1,vacas&&x.passado?0:1,Math.round(x.dif/.5),x.prox,x.dif];
  return out.sort((a,b)=>{const A=k(a),B=k(b);for(let i=0;i<A.length;i++)if(A[i]!==B[i])return A[i]-B[i];return 0}).slice(0,6);
}

  // há quantos dias o destino está sem gado e com que rebrota o último gado saiu
  const infoVazio=(p,dtv)=>{if(ocupantes(p,dtv,PER).length)return'';const u=ultimaEstada(p,dtv,PER);

  // divisas do destino com cada vizinho, considerando o que fica no pasto de saída e os outros destinos

const HIST_PER=[[180,'180 dias'],[365,'365 dias'],[730,'2 anos'],[1460,'4 anos']];
let histDias=180;
function histDados(p,PER,N){

  const D=[];for(let k=0;k<T;k++){const d=addD(ini,k),o=ocupantes(p,d,PER);D.push({d,uh:o.reduce((s,x)=>s+uaSeg(x,d),0)/P[p].area,k:o.map(x=>x.gid+'@'+x.ini).join('|')})}

  for(const x of D){if(x.uh>0){if(!cur){cur={ent:x.d,sai:null,dias:0,soma:0};runs.push(cur)}cur.dias++;cur.soma+=x.uh}else if(cur){cur.sai=x.d;cur=null}}
  const L=leiturasDe(p);
  const leit=(d,obs)=>{const l=L.filter(x=>x.data===d);return l.find(x=>x.obs===obs)||l[l.length-1]||null};
  runs.forEach((r,i)=>{r.uh=r.soma/r.dias;const o=ocupantes(p,r.ent,PER);r.gado=o.map(x=>(x.nome?x.nome+': ':'')+descSeg(x)).join(' + ');

    r.desc=r.sai?(runs[i+1]?dias(r.sai,runs[i+1].ent):null):null;r.descAte=r.sai&&!runs[i+1]?dias(r.sai,fim):null});
  const occ=D.filter(x=>x.uh>0),gaps=runs.filter(r=>r.desc!==null).map(r=>r.desc);
  const res={T,ini,ini0,pct:occ.length/T,uh:occ.length?occ.reduce((s,x)=>s+x.uh,0)/occ.length:0,ent:runs.filter(r=>!r.antes).length,
    ocup:runs.length?runs.reduce((s,r)=>s+r.dias,0)/runs.length:0,desc:gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null,carga:D.reduce((s,x)=>s+x.uh,0)};
  return{D,runs,L:L.filter(l=>l.data>=ini),res,fim}}
function histLinha(H,p){
  const {D,runs,L,res,fim}=H,T=res.T,W=Math.max(360,Math.round(360*T/365)),x=d=>dias(res.ini,d)*W/T,w=Math.max(1,W/T);

    const i=segs.length;segs.push(oc?`${br(D[a].d)} a ${br(D[b].d)} (${b-a+1} dia${b>a?'s':''}): ${f2(um)} UA/ha · ${ocupantes(p,D[a].d,periodos()).map(s=>(s.nome?s.nome+': ':'')+descSeg(s)).join(' + ')}`:`${br(D[a].d)} a ${br(D[b].d)}: descanso (${b-a+1} dia${b>a?'s':''})`);
    h+=`<rect data-i="${i}" x="${(a*w).toFixed(2)}" y="16" width="${((b-a+1)*w).toFixed(2)}" height="26" fill="${oc?'var(--ok)':'var(--line)'}" opacity="${oc?Math.min(1,.35+um/4*.65).toFixed(2):.8}"><title>${esc(segs[i])}</title></rect>`;a=b+1}
  for(const r of runs)if(!r.antes)h+=`<text x="${x(r.ent)}" y="12" font-size="10" text-anchor="middle" fill="var(--ink)">▼</text>`;
  for(const l of L)h+=`<circle cx="${(x(l.data)+w/2).toFixed(1)}" cy="50" r="3" fill="var(--info)"><title>Leitura ${br(l.data)}: altura ${l.altura}, rebrota ${l.rebrota}</title></circle>`;

function histCapim(H,p,PER){
  const {res,L,fim}=H,T=res.T,W=360,Y=v=>10+(5-v)*20,x=d=>T>1?dias(res.ini,d)*W/(T-1):W/2,k=Math.max(1,Math.ceil(T/120));
  const pts=[];for(let i=0;i<T;i+=k)pts.push(addD(res.ini,i));if(pts[pts.length-1]!==fim)pts.push(fim);

  return`<svg viewBox="-14 0 ${W+16} ${Y(0)+18}" style="width:100%;display:block">${h}</svg>
   <p class="muted" style="font-size:12px;margin:2px 0 0"><span style="color:var(--info)">━ altura</span> · <span style="color:var(--ok)">╍ rebrota</span> (estimativa do app) · <span style="color:var(--info)">●</span> <span style="color:var(--ok)">○</span> leituras de campo</p>`}
function histComparar(p,PER){

// ---------- conflitos de vizinhança ----------
function conflitos(PER){
  const ref=hoje(),out=[],visto=new Set();
  for(const p of PASTOS){
    const o=ocupantes(p.id,ref,PER);if(!o.length)continue;
    const sx=o.map(sexo).join('');
    if(sx.includes('M')&&sx.includes('F'))out.push({tipo:'mesmo',a:p.id,la:o});
    for(const v of p.viz){const k=[p.id,v].sort().join('|');if(visto.has(k))continue;visto.add(k);
      const ov=ocupantes(v,ref,PER);if(!ov.length)continue;
      if(choca(sx,ov.map(sexo).join('')))out.push({tipo:'divisa',a:p.id,la:o,b:v,lb:ov})}
  }
  return out;
}

function renderRebanho(){if(exigeAdm('rebanho'))return;
  const PER=periodos(),ref=hoje(),cat={},abertos=PER.filter(x=>x.fim===null);
  for(const x of abertos)for(const k of catsHoje(x,ref)){const t=cat[k.c]=cat[k.c]||{q:0,kg:0,g:0};t.q+=k.q;t.kg+=k.kg;t.g+=k.q*k.gmd}
  const area=PASTOS.filter(p=>!p.naoRecebe).reduce((s,p)=>s+(+p.area||0),0);
  const tot=Object.values(cat).reduce((a,k)=>({q:a.q+k.q,kg:a.kg+k.kg}),{q:0,kg:0});
  const uaT=tot.kg/450;
  const rows=Object.entries(cat).sort((a,b)=>b[1].kg-a[1].kg);
  const f=(x,d=0)=>x.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
  // ① composição
  const mq=Math.max(...rows.map(([c,k])=>k.q),1),mu=Math.max(...rows.map(([c,k])=>k.kg),1);

const PROB_DEP=['Quebrado','Sem tampa','Sujo','Cerca quebrada'],PROB_COCHO=['Quebrados','Furados','Enterrados','Fundos'];
// caixas de marcar dos problemas; devolve ex.: ["Depósito: Sujo","Cochos: Furados"]
const probHtml=(id,sel=[])=>`<div id="${id}" style="font-size:13.5px">${[['Depósito',PROB_DEP],['Cochos',PROB_COCHO]].map(([g,L])=>`<div style="margin-bottom:4px"><b style="font-size:12.5px">${g}</b>${L.map(o=>`<label style="display:flex;gap:6px;align-items:center;font-weight:400;margin:2px 0"><input type="checkbox" value="${g}: ${o}" ${sel.includes(g+': '+o)?'checked':''} style="width:18px;height:18px">${o}</label>`).join('')}</div>`).join('')}</div>`;
const lerProb=id=>[...document.querySelectorAll('#'+id+' input:checked')].map(i=>i.value);
// GPS em segundo plano ao salvar (só o administrador vê); se falhar, salva sem local
const localAuto=()=>Promise.race([pegarLocal().catch(()=>null),new Promise(ok=>setTimeout(()=>ok(null),20000))]);
const FOTO_LADO=1080, FOTO_DPI=200, FOTO_QUAL=0.8;
let _db=null;const _fotoMem={};
function fotoDb(){if(_db)return _db;_db=new Promise((ok,er)=>{try{const r=indexedDB.open('pastosMourao.fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}catch(e){er(e)}});return _db}
async function fotoPut(id,url){_fotoMem[id]=url;try{const db=await fotoDb();await new Promise((ok,er)=>{const t=db.transaction('fotos','readwrite');t.objectStore('fotos').put(url,id);t.oncomplete=ok;t.onerror=()=>er(t.error)})}catch(e){toast('Não foi possível guardar a foto neste aparelho. Exporte os dados antes de fechar.')}}
async function fotoGet(id){if(_fotoMem[id])return _fotoMem[id];try{const db=await fotoDb();return await new Promise(ok=>{const r=db.transaction('fotos').objectStore('fotos').get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}catch(e){return null}}
// reduz para no máximo 1080 px no maior lado, JPEG, e grava 200 dpi no cabeçalho
async function compactarFoto(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url});
    const k=Math.min(1,FOTO_LADO/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',FOTO_QUAL));
    const b=new Uint8Array(await blob.arrayBuffer());
    // cabeçalho JFIF: unidade em polegadas e densidade 200 x 200
    if(b[2]===0xFF&&b[3]===0xE0&&b[6]===0x4A&&b[7]===0x46){b[13]=1;b[14]=FOTO_DPI>>8;b[15]=FOTO_DPI&255;b[16]=FOTO_DPI>>8;b[17]=FOTO_DPI&255}
    let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
    return{url:'data:image/jpeg;base64,'+btoa(s),w,h,kb:Math.round(b.length/1024)}}
  finally{URL.revokeObjectURL(url)}}
function verFoto(url){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px';
  d.innerHTML=`<img src="${url}" style="max-width:100%;max-height:100%;border-radius:6px" alt="Foto da ocorrência">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
// miniaturas: <img data-foto="id"> são preenchidas depois de desenhar a tela
function carregarFotos(raiz){(raiz||document).querySelectorAll('img[data-foto]').forEach(async im=>{const u=await fotoGet(im.dataset.foto);if(u){im.src=u;im.onclick=()=>verFoto(u)}else im.alt='foto não está neste aparelho'})}
const thumbs=ids=>(ids||[]).length?`<div class="thumbs">${ids.map(id=>`<img data-foto="${esc(id)}" alt="Foto">`).join('')}</div>`:'';
// seletor de fotos de um formulário: botão + prévias; devolve função que lê as fotos escolhidas
function seletorFotos(box){const sel=[];
  box.innerHTML=`<label class="btn sec" style="display:inline-flex">📷 Adicionar foto<input type="file" accept="image/*" multiple hidden></label><div class="thumbs"></div><div class="muted fMsg" style="font-size:12.5px"></div>`;
  const inp=box.querySelector('input'),th=box.querySelector('.thumbs'),msg=box.querySelector('.fMsg');
  const draw=()=>{th.innerHTML=sel.map((f,i)=>`<span class="th"><img src="${f.url}" alt="Foto ${i+1}"><button type="button" data-rm="${i}" aria-label="Remover foto">×</button></span>`).join('');
    th.querySelectorAll('img').forEach((im,i)=>im.onclick=()=>verFoto(sel[i].url));th.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sel.splice(+b.dataset.rm,1);draw()});
    msg.textContent=sel.length?`${sel.length} foto(s), ${sel.reduce((s,f)=>s+f.kb,0)} KB no total (compactadas para ${FOTO_LADO} px, ${FOTO_DPI} dpi).`:''};
  inp.onchange=async()=>{msg.textContent='Compactando...';for(const f of inp.files){try{sel.push(await compactarFoto(f))}catch(e){toast('Não consegui abrir uma das imagens')}}inp.value='';draw()};
  return async()=>{const ids=[];for(const f of sel){const id='f'+uid();await fotoPut(id,f.url);ids.push(id)}return ids}}
// localização pelo GPS do celular (funciona sem internet); o link abre no Google Maps
const agoraLocal=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
const mapsUrl=l=>`https://www.google.com/maps?q=${l.lat},${l.lng}`;
const localHtml=l=>l?`<a href="${mapsUrl(l)}" target="_blank" rel="noopener">📍 Ver no Google Maps</a> <span class="muted" style="font-size:12.5px">(${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}${l.prec?', ±'+Math.round(l.prec)+' m':''})</span>`:'';
function pegarLocal(){return new Promise((ok,er)=>{if(!navigator.geolocation)return er(new Error('Este navegador não oferece localização.'));
  navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),prec:p.coords.accuracy}),
    e=>er(new Error(e.code===1?'Permissão de localização negada. Libere a localização para este app nas configurações do navegador.':e.code===3?'O GPS demorou a responder. Tente de novo em local aberto.':'Não foi possível pegar a localização. Ligue o GPS do celular.')),
    {enableHighAccuracy:true,timeout:30000,maximumAge:60000})})}

function contPend(){const V=eventosValidos(),ok=new Set(V.filter(e=>e.tipo==='contagemOk').map(e=>e.ref));
  return V.filter(e=>e.tipo==='contagem'&&!ok.has(e.id)&&e.itens.some(x=>x.cont!==x.esp)).sort((a,b)=>a.data<b.data?-1:1)}

function semContagem(PER,ref){ref=ref||hoje();const ult={};for(const e of eventosValidos())if(e.tipo==='contagem'&&e.data<=ref&&(!ult[e.pasto]||e.data>ult[e.pasto]))ult[e.pasto]=e.data;
  const out=[];for(const p of PASTOS){const o=ocupantes(p.id,ref,PER);if(!o.length)continue;const ent=o.map(x=>x.entrada).sort()[0],b=ult[p.id]&&ult[p.id]>=ent?ult[p.id]:ent,d=dias(b,ref);
    if(d>contDias())out.push({p,d,ult:ult[p.id]||null})}return out.sort((a,b)=>b.d-a.d)}

function pesoCat(c,pasto,d,PER){let q=0,w=0,g=0;for(const x of PER){if(!((x.ini<=d||x.ini===DATA.base)&&(x.fim===null||x.fim>d)))continue;if(pasto&&x.pasto!==pasto)continue;for(const k of catsHoje(x,d))if(k.c===c){q+=k.q;w+=k.q*k.peso;g+=k.q*k.gmd}}
  if(!q&&pasto)return pesoCat(c,null,d,PER);return q?{w:w/q,g:g/q}:{w:SEXAR.includes(c)||c==='Potros'?pesoNasc(c):300,g:gmdNasc(c)}}

// leituras seguidas do mesmo pasto: com menos de 3 dias entre elas e leitores diferentes, comparam os leitores;
// com 3 dias ou mais, o capim não pode cair com o pasto vazio o tempo todo nem subir com gado acima do que o pasto mantém
function conferirLeituras(PER){return memo(PER,'conf','',()=>{const incons=[],pares=[];
  for(const p of PASTOS){const L=leiturasDe(p.id);if(L.length<2)continue;const uaN=uaHaRapido(p.id,PER);
    for(let i=1;i<L.length;i++){const a=L[i-1],b=L[i],dt=dias(a.data,b.data);
      if(dt<3){if(a.user&&b.user&&a.user!==b.user)pares.push({p,a,b,dt});continue}
      let com=0,soma=0;const n0=toD(a.data)/DAY;for(let k=0;k<dt;k++){const u=uaN(n0+k);if(u>0){com++;soma+=u}}
      if(!com&&(b.altura<a.altura||b.rebrota<a.rebrota))incons.push({p,a,b,dt,tipo:'vazio'});
      else if(com===dt&&b.altura>a.altura){const um=soma/dt,lim=EP(epocaEm(a.data)).ua;if(um>lim)incons.push({p,a,b,dt,tipo:'gado',um,lim})}}}
  return{incons:incons.sort((x,y)=>x.b.data<y.b.data?1:-1),pares}})}

// ---------- reprodução ----------
// gestação ~285 dias: partos entre 275 dias depois do início e 295 dias depois do fim da estação
const GEST=[275,295],FEM_REP=['Vacas','Vacas cheias','Vacas vazias','Novilhas'];
function indEstacao(x,PER){const d0=x.ini<hoje()?x.ini:hoje();let exp=0,tour=0;
  for(const pid of x.pastos||[])for(const sg of ocupantes(pid,d0,PER))for(const [c,k] of Object.entries(sg.cats)){if(FEM_REP.includes(c))exp+=k.q;if(c==='CEIP')tour+=k.q}
  let pren=0,vaz=0;for(const e of eventosValidos())if(e.tipo==='categoria'&&e.diag&&e.diag.est===x.id){pren+=e.diag.pren;vaz+=e.diag.vaz}
  const de=addD(x.ini,GEST[0]),ate=addD(x.fim,GEST[1]),h=hoje();

    <div class="row"><div><label for="psQ">Vender (cabeças)</label><input id="psQ" type="number" min="1" inputmode="numeric"></div><div><label for="psC">Categoria</label><select id="psC">${CS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="psM">Em</label><select id="psM">${mOpt(0)}</select></div></div>
    <button class="btn sec" type="button" id="psV">Simular venda</button>
    ${SUP.length?`<div class="row"><div><label for="psSC">Suplementar</label><select id="psSC">${CS.map(c=>`<option>${c}</option>`).join('')}</select></div><div><label for="psS">Com</label><select id="psS">${SUP.map(s=>`<option value="${esc(s.id)}">${esc(s.nome)} (poupa ${Math.round(poupa(s)*100)}%)</option>`).join('')}</select></div></div>
    <div class="row"><div><label for="psDe">De</label><select id="psDe">${mOpt(0)}</select></div><div><label for="psAte">Até</label><select id="psAte">${mOpt(5)}</select></div></div>
    <button class="btn sec" type="button" id="psSup">Simular suplemento</button>`:'<p class="muted" style="font-size:12.5px;margin:0">Cadastre suplementos em Administrador › Suplementações para simular.</p>'}
    ${psSim.length?`<div class="stack" style="gap:6px">${psSim.map((s,i)=>`<div style="display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px"><span>${s.tipo==='venda'?`Vender ${s.q} ${s.cat.toLowerCase()} em ${out[s.i].mes}`:`${s.cat} com ${esc((supDe(s.sup)||{}).nome||'suplemento')}, ${out[s.de].mes} a ${out[s.ate].mes}`}</span><button class="btn sec" type="button" data-psx="${i}" style="padding:4px 8px;font-size:12px">Tirar</button></div>`).join('')}<button class="btn sec" type="button" id="psLimpa">Limpar simulação</button></div>`:''}</div>`;
  ligaVolta('planseca');
  $('#psV').onclick=()=>{const q=parseInt($('#psQ').value)||0,c=$('#psC').value;if(q<1)return toast('Informe quantas cabeças');if(q>(C[c]?C[c].q:0))return toast(`Hoje há só ${C[c]?C[c].q:0} ${c.toLowerCase()}`);psSim.push({tipo:'venda',q,cat:c,i:+$('#psM').value});renderPlanSeca()};
  if($('#psSup'))$('#psSup').onclick=()=>{const de=+$('#psDe').value,ate=+$('#psAte').value;if(ate<de)return toast('O fim tem que ser depois do início');psSim.push({tipo:'sup',cat:$('#psSC').value,sup:$('#psS').value,de,ate});renderPlanSeca()};
  document.querySelectorAll('[data-psx]').forEach(b=>b.onclick=()=>{psSim.splice(+b.dataset.psx,1);renderPlanSeca()});
  if($('#psLimpa'))$('#psLimpa').onclick=()=>{psSim=[];renderPlanSeca()}}

// ---------- vendedores (pessoa física) e total vendido por CPF ----------
function vendasPorCpf(){const G={};for(const e of eventosValidos()){if(e.tipo!=='venda')continue;const ano=+e.data.slice(0,4),v=e.vend?vendDe(e.vend):null,k=ano+'|'+(v?v.id:'');
    const g=G[k]=G[k]||{ano,nome:v?v.nome:'Sem vendedor',cpf:v?cpfFmt(v.cpf):'',n:0,q:0,v:0};g.n++;g.q+=e.qtd;g.v+=valorEv(e)||0}
  return Object.values(G).sort((a,b)=>b.ano-a.ano||(a.cpf?0:1)-(b.cpf?0:1)||a.nome.localeCompare(b.nome))}
let vendAno=null;
function renderVendedores(){if(exigeAdm('vendedores'))return;
  const L=S.config.vendedores||[],VA=vendasPorCpf(),ya=+hoje().slice(0,4),anos=[...new Set([ya,...VA.map(x=>x.ano)])].sort((a,b)=>b-a);if(!vendAno||!anos.includes(vendAno))vendAno=ya;
  const A=VA.filter(x=>x.ano===vendAno),tot=A.reduce((s,x)=>s+x.v,0);
  $('#tab-vendedores').innerHTML=`${voltaAdm}<h2>Vendedores (CPF)</h2>
   <p class="muted" style="margin-top:0">A fazenda vende em nome de mais de uma pessoa física. Cadastre cada uma aqui; na venda, o vendedor é escolhido numa lista. O total por CPF no ano serve para o imposto de renda (também na aba "Vendas por CPF" da planilha).</p>
   <h3 style="margin-top:0">Total vendido por CPF</h3>
   <div class="card stack"><div><label for="vAno">Ano</label><select id="vAno">${anos.map(y=>`<option ${y===vendAno?'selected':''}>${y}</option>`).join('')}</select></div>
    ${A.length?`<div class="tbl"><table><tr><th>Vendedor</th><th>CPF</th><th style="text-align:right">Vendas</th><th style="text-align:right">Cabeças</th><th style="text-align:right">Valor</th></tr>${A.map(x=>`<tr${x.cpf?'':' style="color:var(--warn)"'}><td>${esc(x.nome)}</td><td>${esc(x.cpf)||'—'}</td><td style="text-align:right">${x.n}</td><td style="text-align:right">${x.q}</td><td style="text-align:right">${brl(x.v)}</td></tr>`).join('')}
     <tr><td colspan="4"><b>Total</b></td><td style="text-align:right"><b>${brl(tot)}</b></td></tr></table></div>`:'<p class="muted" style="margin:0">Nenhuma venda neste ano.</p>'}
    <p class="muted" style="font-size:12.5px;margin:0">Valor = cabeças × @ de carcaça × preço da @ informados em cada venda.</p></div>
   <h3>Cadastro</h3>
   <div class="stack">${L.map((v,i)=>`<form class="card stack" data-vd="${i}"><div class="row"><div><label>Nome</label><input name="n" value="${esc(v.nome)}" required></div><div><label>CPF</label><input name="c" value="${esc(cpfFmt(v.cpf))}" inputmode="numeric" required></div></div>
     <div class="row"><button class="btn sec" type="submit">Salvar</button><button class="btn sec" type="button" data-vat="${i}">${v.ativo===false?'Ativar':'Desativar'}</button>${v.ativo===false?'<span class="chip c-bad">inativo</span>':''}</div></form>`).join('')||'<p class="muted">Nenhum vendedor cadastrado.</p>'}</div>
   <form id="fVend" class="card stack" style="margin-top:12px"><b>Novo vendedor</b><div class="row"><div><label for="vNome">Nome</label><input id="vNome" required></div><div><label for="vCpf">CPF</label><input id="vCpf" inputmode="numeric" placeholder="000.000.000-00" required></div></div><button class="btn" type="submit">Cadastrar</button></form>`;
  ligaVolta('vendedores');$('#vAno').onchange=()=>{vendAno=+$('#vAno').value;renderVendedores()};
  const ok=(n,c,i)=>{const d=c.replace(/\D/g,'');if(!n){toast('Informe o nome');return null}if(!cpfOk(d)){toast('CPF inválido: confira os números');return null}
    if(L.some((v,j)=>j!==i&&String(v.cpf).replace(/\D/g,'')===d)){toast('Esse CPF já está cadastrado');return null}return d};
  $('#fVend').onsubmit=e=>{e.preventDefault();const n=$('#vNome').value.trim(),d=ok(n,$('#vCpf').value,-1);if(!d)return;gravaCfg('vendedores',[...L,{id:'v_'+uid(),nome:n,cpf:d,ativo:true}],`Vendedor cadastrado: ${n}`,'vendedores')};
  document.querySelectorAll('#tab-vendedores [data-vd]').forEach(f=>f.onsubmit=e=>{e.preventDefault();const i=+f.dataset.vd,n=f.n.value.trim(),d=ok(n,f.c.value,i);if(!d)return;gravaCfg('vendedores',L.map((v,j)=>j===i?{...v,nome:n,cpf:d}:v),`Vendedor alterado: ${n}`,'vendedores')});
  document.querySelectorAll('#tab-vendedores [data-vat]').forEach(b=>b.onclick=()=>{const i=+b.dataset.vat,M=L.map((v,j)=>j===i?{...v,ativo:v.ativo===false}:v);gravaCfg('vendedores',M,`Vendedor ${M[i].ativo?'ativado':'desativado'}: ${M[i].nome}`,'vendedores')})}

// ---------- menu Mais ----------

  const nC=conflitos(periodos()).length;
  $('#tab-mais').innerHTML=`<h2>Mais</h2><div class="menu">
   <button data-go="passar"><span>Passar para outro celular<small>Sem internet: manda os lançamentos por Quick Share ou Bluetooth</small></span>${estadoCopia().n?`<span class="badge c-warn">${estadoCopia().n}</span>`:''}</button>
   ${isGestor()?`<button data-go="contagens"><span>Contagens com diferença<small>Aprovar como morte, nascimento ou ajuste</small></span>${(()=>{const n=contPend().length;return `<span class="badge ${n?'c-warn':'c-ok'}">${n}</span>`})()}</button>`:''}
   ${isGestor()?`<button data-go="conferencia"><span>Conferência das leituras<small>Leituras que não fecham e comparação entre leitores</small></span>${(()=>{const n=confPend(periodos()).length;return `<span class="badge ${n?'c-warn':'c-ok'}">${n}</span>`})()}</button>`:''}
   <button data-go="usuario"><span>Usuário<small>Trocar minha senha</small></span></button>
   <button data-go="meus"><span>Meus lançamentos<small>O que ${esc(SES.nome)} lançou, por dia (últimos 30)</small></span></button>

   ${pode('historico')?'':'<!--'}<button data-go="historico"><span>Histórico do pasto<small>Leituras, consumo e ritmo de cada pasto</small></span></button>${pode('historico')?'':'-->'}
   ${pode('dados')?'':'<!--'}<button data-go="dados"><span>Dados e sincronização<small>Enviar dados, cópia de segurança, juntar dados de outro celular</small></span></button>${pode('dados')?'':'-->'}
   <button data-go="adm"><span>Administrador<small>Rebanho, Pastos, Configurações, Registro do sistema, Apagar dados</small></span>${isAdmin()?'<span class="chip c-ok">ativo</span>':'🔒'}</button>

}

// ---------- navegação ----------
const R={sanitcal:renderSanCal,reproducao:renderReproducao,custos:renderCustos,planseca:renderPlanSeca,vendedores:renderVendedores,relatorio:renderRelatorio,chuva:renderChuva,previsao:renderPrevisao,contagens:renderContagens,usinc:renderUsinc,conferencia:renderConferencia,passar:renderPassar,usuario:renderUsuario,meus:renderMeus,admin:renderAdmin,adm:renderAdm,registro:renderRegistro,apagar:renderApagar,supl:renderSupl,suplementos:renderSuplementos,sinc:renderSinc,painel:renderPainel,leitura:renderLeitura,mudanca:renderGado,historico:renderHistorico,dados:renderDados,rebanho:renderRebanho,ocorrencias:renderOcorrencias,vizinhanca:renderVizinhanca,pastos:renderPastos,mais:renderMais};
const SUB={sanitcal:'mais',reproducao:'mais',custos:'mais',planseca:'mais',vendedores:'mais',relatorio:'mais',previsao:'mais',contagens:'mais',conferencia:'mais',passar:'mais',usuario:'mais',meus:'mais',admin:'mais',adm:'mais',registro:'mais',apagar:'mais',sinc:'mais',historico:'mais',dados:'mais',vizinhanca:'mais',pastos:'mais',rebanho:'mais',suplementos:'mais'};
const NAV_FR={painel:1,leitura:1,mudanca:.9,supl:1.45,ocorrencias:1.3,chuva:.95,mais:.9};
function ajustaNav(){const B=[...document.querySelectorAll('nav.tabs button')];B.forEach(b=>b.hidden=!podeTela(b.dataset.tab));
  $('#nav').style.gridTemplateColumns=B.filter(b=>!b.hidden).map(b=>(NAV_FR[b.dataset.tab]||1)+'fr').join(' ')}
// ---------- ajuda de cada tela (textos editáveis em Configurações) ----------
const AJUDA_PAD={
 painel:'Mostra todos os pastos. Altura e rebrota (0 a 5) são estimadas para hoje a partir da última leitura.\nOs avisos em vermelho ficam no topo; o resto está em "Pendências". Toque nos números (Atenção, Com gado, Prontos...) para filtrar, e num pasto para ver o histórico dele.',
 leitura:'Lance aqui a nota do capim de cada pasto: altura (quantidade de capim) e rebrota (folha nova), de 0 a 5. Não faça média das duas.\nPasto com gado: leitura a cada 3 dias. Vazio: até 20 dias depois da saída. Os pendentes aparecem primeiro; depois de salvar, o app abre o próximo.',
 mudanca:'Lançamentos do gado: mudança de pasto, nascimento, morte, mudar categoria, venda, compra, pesagem, contagem, sanitário e diagnóstico de prenhez.\nNa venda e na compra, informe a GTA e a nota quando tiver (dá para completar depois no botão "GTA / nota").\nNa mudança, marque a altura e a rebrota do pasto de saída e do de entrada. Na contagem, conte o lote e digite quanto achou de cada categoria: se não bater, vai para o gerente aprovar.\nLançou errado? Nada se apaga: faça o estorno ou o lançamento ao contrário.',
 supl:'Suplemento por pasto, planejamento, rota do trator e mapa do estoque.\nNa entrega, conte os sacos que estavam no depósito antes de deixar os novos.',
 ocorrencias:'Registre o que viu no pasto: cerca quebrada, falta de água, animal doente etc. Marque a gravidade, o local (GPS funciona sem internet) e tire foto.\nCada gravidade tem prazo para resolver. Quando resolver, toque em "Marcar resolvida".',
 chuva:'Lance a chuva do pluviômetro: data e milímetros. Se choveu duas vezes no dia, lance as duas.\nO resumo mostra o total de cada mês e de cada ano, e dá para comparar com outros anos.',
 passar:'Sem internet: mande os lançamentos deste celular para outro por Quick Share ou Bluetooth. O outro celular junta os dados e manda para a planilha quando tiver sinal.',
 contagens:'Contagens que não bateram com o app. Para cada diferença escolha: morte, nascimento ou ajuste (com o motivo). "Contar de novo" descarta a contagem.',
 historico:'Histórico do pasto: leituras, entradas e saídas de gado, consumo e ritmo do capim. O ritmo de cada pasto é calculado pelas leituras de cada época.',
 dados:'Envie os dados para a planilha (Sinc.), faça cópia de segurança ou junte o arquivo de outro celular.'};
const AJUDA_NOME={painel:'Painel',leitura:'Leitura',mudanca:'Gado',supl:'Suplementação',ocorrencias:'Ocorrência',chuva:'Chuva',passar:'Passar para outro celular',contagens:'Contagens com diferença',historico:'Histórico do pasto',dados:'Dados'};
const ajudaTxt=t=>{const c=(S.config.ajuda||{})[t];return c!=null&&c.trim()?c:AJUDA_PAD[t]||''};
const prefUser=(k,v)=>{const key=KEY+'.'+k+'.'+(SES?SES.id:'');try{if(v===undefined)return JSON.parse(localStorage.getItem(key)||'null');localStorage.setItem(key,JSON.stringify(v))}catch(e){return null}};
function mostrarAjuda(t){const tx=ajudaTxt(t);if(!tx)return;const f=document.createElement('div');f.id='ajudaFundo';
  f.innerHTML=`<div id="ajudaBox" role="dialog" aria-label="Ajuda"><b style="font-size:17px">${esc(AJUDA_NOME[t]||'Ajuda')}</b>${tx.split('\n').filter(x=>x.trim()).map(x=>`<p>${esc(x)}</p>`).join('')}<button type="button" class="btn wide" id="ajudaOk">Entendi</button></div>`;
  document.body.appendChild(f);const fecha=()=>f.remove();$('#ajudaOk').onclick=fecha;f.onclick=e=>{if(e.target===f)fecha()}}
// letra grande: cada toque aumenta 10% até 40% e volta ao normal; guarda por usuário e por tela
let _telaAtual='painel';
function aplicaLetra(t){const z=(prefUser('letra')||{})[t]||0,sec=$('#tab-'+t);document.querySelectorAll('main>section').forEach(x=>x.style.zoom='');if(sec&&z)sec.style.zoom=1+z/100;$('#btLetra').textContent=z?`A+ ${z}%`:'A+'}
$('#btLetra').onclick=()=>{const L=prefUser('letra')||{},z=((L[_telaAtual]||0)+10)%50;L[_telaAtual]=z;prefUser('letra',L);aplicaLetra(_telaAtual);toast(z?`Letra ${z}% maior nesta tela`:'Letra normal nesta tela')};
$('#btAjuda').onclick=()=>mostrarAjuda(_telaAtual);
// tema: automático (do celular), claro (sol forte) ou escuro
function aplicaTema(){const t=prefUser('tema');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
function go(t,livre){if(!SES)return mostrarLogin();if(t==='sinc'){t='dados';livre=true}
  ajustaNav();if(!livre&&!podeTela(t)){const ok=['painel','leitura','mudanca','supl','ocorrencias'].find(podeTela);t=ok||'mais'}document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='tab-'+t);
  const nt=SUB[t]||t;document.querySelectorAll('nav.tabs button').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.tab===nt)b.setAttribute('aria-current','page')});
  if(t==='pastos'&&!SUB.__keep)editPasto=null;
  if(t==='mudanca'&&!gadoPre)morteP=morteCat=null;
  R[t]();window.scrollTo(0,0);try{localStorage.setItem(KEY+'.tab',t)}catch(e){}
  _telaAtual=t;aplicaLetra(t);$('#btAjuda').hidden=!ajudaTxt(t);
  // na primeira vez em cada tela, a ajuda aparece sozinha
  if(ajudaTxt(t)){const V=prefUser('ajudaVista')||{};if(!V[t]){V[t]=1;prefUser('ajudaVista',V);if(!document.getElementById('ajudaFundo'))mostrarAjuda(t)}}}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#btResumo').onclick=enviarResumo;$('#btSair').onclick=()=>{if(confirm('Sair e trocar de usuário?'))sair()};$('#btSinc').onclick=()=>{dadosSincAgora=!!sincCfg().url;go('dados',true)};$('#hdrWho').onclick=()=>go('meus');
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
carregarIDB().then(()=>{if(SES&&(SES.id==='admin'||(usuario(SES.id)&&usuario(SES.id).ativo!==false)))mostrarApp();else{SES=null;mostrarLogin()}});
setInterval(()=>{if(SES)atualizaTopo()},60000);
</script>
