<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fazenda Mourão</title>
<meta name="theme-color" content="#24452f">
<style>
/* Layout: app de campo, uma coluna, barra de abas fixa embaixo, botões grandes para usar com o polegar */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --ink:#1d2a20; --muted:#5e6b60; --line:#d7ddd2;
  --brand:#24452f; --brand-ink:#ffffff; --accent:#b8860b;
  --ok:#2f7d3a; --warn:#b26b00; --bad:#b3261e; --info:#2b5f8a;
  --ok-bg:#e3f1e2; --warn-bg:#fbefd9; --bad-bg:#f9e1df; --info-bg:#e1ecf5;
  --font:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:"Arial Narrow","Roboto Condensed","Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121813; --surface:#1b231d; --ink:#e6ece4; --muted:#9daa9e; --line:#2f3a31;
  --brand:#3d6b4a; --brand-ink:#ffffff; --accent:#e0b04a;
  --ok:#7cc285; --warn:#e6a94a; --bad:#f08a80; --info:#8bb8de;
  --ok-bg:#1f3322; --warn-bg:#3a2d14; --bad-bg:#3d1f1c; --info-bg:#1b2c3b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121813; --surface:#1b231d; --ink:#e6ece4; --muted:#9daa9e; --line:#2f3a31;
  --brand:#3d6b4a; --brand-ink:#ffffff; --accent:#e0b04a;
  --ok:#7cc285; --warn:#e6a94a; --bad:#f08a80; --info:#8bb8de;
  --ok-bg:#1f3322; --warn-bg:#3a2d14; --bad-bg:#3d1f1c; --info-bg:#1b2c3b; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
header.top h1{margin:0;font:700 clamp(13.5px,4.1vw,19px)/1.1 var(--display);letter-spacing:.01em;white-space:nowrap}
header.top small{opacity:.85;font-size:12px}
main{padding:14px 16px 96px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr .9fr 1.45fr 1.3fr .9fr;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:9px 1px 10px;color:var(--muted);font:600 11px var(--font);letter-spacing:-.1px;white-space:nowrap;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
@media (max-width:380px){nav.tabs button{font-size:9.5px;letter-spacing:-.2px}}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--brand)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ok)}}
h2{font:700 18px/1.2 var(--display);margin:4px 0 10px;text-wrap:balance}
h3{font:700 15px/1.2 var(--font);margin:16px 0 8px}
.muted{color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
label{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
input,select,textarea{width:100%;font:16px var(--font);padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.scale{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.scale button{padding:11px 0;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:700 16px var(--font);cursor:pointer}
.scale button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:10px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:600 14px var(--font);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 16px;border-radius:9px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);font:700 15px var(--font);cursor:pointer}
.btn.sec{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn.wide{width:100%}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.summary button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 6px;text-align:left;cursor:pointer}
.summary b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.summary span{font-size:11.5px;color:var(--muted)}
.summary button[aria-pressed="true"]{outline:2px solid var(--brand)}
.plist{display:flex;flex-direction:column;gap:6px}
.p{display:grid;grid-template-columns:4px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px 9px 0;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.p .stripe{align-self:stretch;border-radius:9px 0 0 9px}
.p .nm{font:700 16px var(--display)}
.p .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.p .rt{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
.bar{width:74px;height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-left:auto;margin-top:4px}
.bar i{display:block;height:100%}
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:999px;margin:2px 4px 0 0}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)} .c-bad{background:var(--bad-bg);color:var(--bad)} .c-info{background:var(--info-bg);color:var(--info)}
.note{border-radius:9px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.note.bad{background:var(--bad-bg);color:var(--ink);border:1px solid var(--bad)}
.note.ok{background:var(--ok-bg);color:var(--ink);border:1px solid var(--ok)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sugs button{border:1px solid var(--ok);background:var(--ok-bg);color:var(--ink);border-radius:8px;padding:6px 9px;font:600 13px var(--font);cursor:pointer;text-align:left}
.menu{display:grid;gap:8px}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:600 15px var(--font);cursor:pointer;text-align:left}
.menu button small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.menu .badge{font:700 13px var(--font);padding:2px 9px;border-radius:999px}
.vizpick{display:flex;flex-wrap:wrap;gap:6px;max-height:260px;overflow:auto;padding:4px;border:1px solid var(--line);border-radius:8px}
.vizpick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 10px;font:600 13px var(--font);cursor:pointer}
.vizpick button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tiles div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.tiles b{display:block;font:700 22px var(--display);font-variant-numeric:tabular-nums}
.tiles span{font-size:12px;color:var(--muted)}
td.num,th.num{text-align:right}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:9;max-width:90vw}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.p,.btn{transition:transform .08s}.p:active,.btn:active{transform:scale(.99)}}
[hidden]{display:none!important}
header.top{align-items:center}
header.top .who{display:block;opacity:.9;font-size:12px;margin-top:2px;background:none;border:0;color:inherit;padding:0;font:600 12px var(--font);cursor:pointer;text-decoration:underline dotted}
.topbtns{display:flex;gap:6px}
.topbtns button{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);color:var(--brand-ink);border-radius:8px;padding:5px 8px;font:600 11px var(--font);cursor:pointer}
.topbtns svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.topbtns .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:9px;padding:0 4px;font:700 11px/18px var(--font);background:var(--accent);color:#1d2a20}
.topbtns .dot.bad{background:#f08a80}
#login{max-width:420px;margin:0 auto;padding:40px 16px}
#login h1{font:700 26px var(--display);color:var(--brand);margin:0 0 4px}
:root[data-theme="dark"] #login h1{color:var(--ok)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #login h1{color:var(--ok)}}
.dia{font:700 13px var(--font);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.pc{display:grid;grid-template-columns:5px minmax(0,1fr) minmax(0,1.25fr);background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;text-align:left;color:var(--ink);font:inherit;padding:0;width:100%;font-size:13px}
.pc .stripe{grid-row:1/3}
.pcL,.pcR{padding:9px 10px;min-width:0}
.pcR{border-left:1px dashed var(--line)}
.pc .nm{font:700 16px var(--display)}
.pc .sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.pc .br{display:grid;grid-template-columns:54px 1fr 30px;align-items:center;gap:6px;margin:3px 0;font-size:12.5px}
.pc .br b{text-align:right;font-variant-numeric:tabular-nums}
.pc .bar{width:auto;margin:0}
.pc .lt{font:700 14px var(--font)}
.pc .ct{margin-top:3px;font-size:12.5px}
.pc hr{border:0;border-top:1px solid var(--line);margin:7px 0}
.pcA{grid-column:2/4;padding:4px 10px 8px;border-top:1px solid var(--line)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.qst{display:flex;align-items:center;gap:4px;flex:0 0 auto}
.qst .btn{padding:6px 12px;font-size:18px;line-height:1}
.qst input{width:64px;text-align:center;padding:7px 4px}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:7px;border:1px solid var(--line);cursor:pointer;background:var(--line)}
.thumbs .th{position:relative}
.thumbs .th button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--bad);color:#fff;font:700 14px/22px var(--font);cursor:pointer;padding:0}
.lg{display:grid;grid-template-columns:44px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14px}
.lg:last-child{border-bottom:0}
.lg time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.lg .t{font-weight:700}
</style>

// adubações lançadas nas leituras: capacidade (UA/ha por 30 dias) que cai até o normal ao longo do efeito, contado da liberação
function adubacoes(pasto){return leiturasDe(pasto).filter(l=>marcas(l).includes('adubado')).map(l=>{const data=l.aduboData||l.data;return{data,libera:addD(data,l.aduboDias||0),ua:+l.aduboUA||0,ef:+l.aduboEf||60}}).sort((a,b)=>a.data<b.data?-1:1)}
// crescimento extra do adubado: 3 UA/ha por 30 dias é o normal; X UA/ha por 30 dias pede (X-3)/12 a mais por dia (só nas águas)
function bonusAd(AD,d,ep){if(ep!=='aguas')return 0;let a=null;for(const x of AD)if(x.data<=d)a=x;if(!a||!(a.ua>3))return 0;
  const t=d<a.libera?0:dias(a.libera,d),f=Math.max(0,1-t/a.ef);return (a.ua-3)/12*f}
const suplementos=()=>S.config.suplementos||[];
const supDe=id=>suplementos().find(s=>s.id===id)||null;
const USO={aguas:'Águas',seca:'Seca',ambas:'Águas e seca'};
// suplemento fora da época: de águas na seca, ou de seca nas águas (nas transições serve qualquer um)
const foraEpoca=(s,ep)=>s&&((s.uso==='aguas'&&ep==='seca')||(s.uso==='seca'&&ep==='aguas'));
function supEm(SP,d){for(const x of SP)if(x.ini<=d&&x.fim>d)return supDe(x.sup);return null}
// capim poupado = % de ingestão do suplemento ÷ 2,5% (consumo total de pasto ≈ 2,5% do peso vivo)
const poupa=s=>s?Math.min(.9,Math.max(0,s.pct/2.5)):0;

// ---------- ritmo de cada pasto (média dos últimos 60 dias) ----------
function leiturasDe(pasto){return S.leituras.filter(l=>l.pasto===pasto).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criado||0)-(b.criado||0))}
function intervalos(pasto,PER){
  const L=leiturasDe(pasto),out=[],EPS=epocas(),AD=adubacoes(pasto),SP=supPer(pasto,PER);
  for(let i=1;i<L.length;i++){
    const a=L[i-1],b=L[i],dt=dias(a.data,b.data);if(dt<=0)continue;
    let soma=0,somaE=0,bon=0;for(let k=0;k<dt;k++){const d=addD(a.data,k),uh=uaHa(pasto,d,PER);soma+=uh;somaE+=uh*(1-poupa(supEm(SP,d)));bon+=bonusAd(AD,d,epocaEm(d,EPS))}
    const u=soma/dt,uE=somaE/dt,bo=bon/dt, la=nivel(a), lb=nivel(b), taxa=(lb-la)/dt, ep=epocaEm(a.data,EPS);
    const valido=!(la>=5&&lb>=5)&&!(la<=0&&lb<=0);
    // crescimento próprio do pasto, sem o efeito do adubo e com o capim poupado pelo suplemento
    out.push({de:a.data,ate:b.data,dt,ua:u,la,lb,taxa,ep,g:u>0?taxa+C*uE-bo:(taxa-bo)*EP(ep).g/EP(ep).rec,valido});
  }
  return out;
}
// ritmo separado por época: leituras da seca só valem para a seca
function ritmo(pasto,PER,ref,ep){
  ref=ref||hoje();ep=ep||epocaEm(ref);const lim=addD(ref,-JANELA);
  const I=intervalos(pasto,PER).filter(x=>x.valido&&x.ate>lim&&x.ep===ep);
  if(!I.length)return{g:EP(ep).g,gBase:EP(ep).g,n:0,proprio:false,ep};
  let sw=0,s=0;for(const x of I){const w=Math.min(x.dt,dias(lim,x.ate));s+=x.g*w;sw+=w}
  const g=Math.min(.5,Math.max(.02,s/sw));
  return{g,gBase:g,n:I.length,proprio:true,ep};
}
// estimativa do capim hoje
function estado(pasto,PER,ref){
  ref=ref||hoje();const L=leiturasDe(pasto).filter(l=>l.data<=ref);
  const RT={},rit=ep=>RT[ep]=RT[ep]||ritmo(pasto,PER,ref,ep),EPS=epocas(),AD=adubacoes(pasto),SP=supPer(pasto,PER);
  let lv,t0,suposto=false;const ul=L[L.length-1]||null;
  if(ul){lv=nivel(ul);t0=ul.data}else{lv=5;t0=DATA.base;suposto=true}
  const lv0=lv;
  // ponto do capim: dias desde que o pasto vazio chegou a 5; passado pela leitura vale até entrar gado
  // conta a partir de quando a ALTURA chega a 5 com o pasto vazio
  const alt0=ul?ul.altura:5,altDe=x=>Math.min(5,Math.max(0,alt0+x-lv0));
  let cheio=(altDe(lv)>=4.95&&!ocupantes(pasto,t0,PER).length)?t0:null, passadoLeit=!!(ul&&marcas(ul).includes('passado'));
  for(let k=0;k<dias(t0,ref);k++){const d=addD(t0,k),ep=epocaEm(d,EPS),rr=rit(ep),b=bonusAd(AD,d,ep);const uh=uaHa(pasto,d,PER);
    lv=Math.min(5,Math.max(0,lv+(uh>0?rr.g+b-C*uh*(1-poupa(supEm(SP,d))):EP(ep).rec*rr.g/EP(ep).g+b)));
    if(uh>0){cheio=null;passadoLeit=false}else if(altDe(lv)>=4.95&&!cheio)cheio=addD(d,1)}
  const occ=ocupantes(pasto,ref,PER), u=uaHa(pasto,ref,PER);
  const ep=epocaEm(ref,EPS),r0=rit(ep),bH=bonusAd(AD,ref,ep),sup=occ.length?supEm(SP,ref):null,pH=poupa(sup);
  // r.g = crescimento de hoje (ritmo do pasto + adubo); gBase = só o ritmo
  const r={...r0,g:r0.g+bH,gBase:r0.g,bonus:bH};
  // altura e rebrota estimadas: a mesma variação do capim aplicada às notas da última leitura
  const cl=x=>Math.min(5,Math.max(0,x));
  const alt=ul?cl(ul.altura+lv-lv0):lv, reb=ul?cl(ul.rebrota+lv-lv0):lv;
  const dp=diasPassado(pasto);
  const mk=ul?marcas(ul):[],adubo=aduboDe(pasto,ref);
  const noPonto=cheio?dias(cheio,ref):null;
  const talo=alt>=3&&reb<3;
  const passado=!occ.length&&(passadoLeit||(noPonto!==null&&noPonto>dp)||talo);
  const passaEm=!occ.length&&!passado&&noPonto!==null?Math.max(0,dp-noPonto):null;
  let diasAte1=null,diasAte5=null;
  if(occ.length){const q=C*u*(1-pH)-r.g;diasAte1=q>0?Math.max(0,(lv-1)/q):Infinity}
  else diasAte5=lv>=5?0:(5-lv)/(EP(ep).rec*r0.g/EP(ep).g+bH);
  return{ep,sup,poup:pH,lv,alt,reb,occ,u,r,diasAte1,diasAte5,suposto,ultima:ul,passado,talo,passaEm,cheio,dp,fraco:mk.includes('fraco'),sujo:mk.includes('sujo'),adubo};
}
// dias que o capim fica passado depois de a altura chegar a 5: configuração da fazenda (só o administrador altera)
const DIAS_PONTO=10;
const diasGeral=()=>S.config.diasPassado||DIAS_PONTO;
const diasPassado=pasto=>(pasto&&P[pasto]&&+P[pasto].diasPassado)||diasGeral();
// marcas do ponto do capim numa leitura (leituras antigas tinham um valor só)
const MARCAS=[['ponto','No ponto'],['passado','Passado'],['fraco','Fraco'],['sujo','Sujo'],['adubado','Adubado']];
function marcas(l){if(Array.isArray(l.pontos))return l.pontos;const m=[];if(l.ponto)m.push(l.ponto);if(l.situacao==='adubado')m.push('adubado');return m}
// adubação da última leitura que marcou adubado: libera o gado depois dos dias informados
function aduboDe(pasto,ref){const L=leiturasDe(pasto).filter(l=>l.data<=(ref||hoje())&&marcas(l).includes('adubado'));if(!L.length)return null;const l=L[L.length-1];
  const data=l.aduboData||l.data,diasE=l.aduboDias||0;return{data,dias:diasE,libera:addD(data,diasE)}}
function ultimaLeitura(pasto){const L=leiturasDe(pasto);return L[L.length-1]}

// ---------- alertas ----------
function alertas(PER){
  const ref=hoje(),A={};const add=(p,tipo,txt)=>(A[p]=A[p]||[]).push({tipo,txt});
  for(const p of PASTOS){
    const e=estado(p.id,PER,ref),ul=e.ultima;
    if(e.occ.length){
      if(e.lv<=1.2)add(p.id,'bad','Capim no fim: mudar o lote');
      else if(e.diasAte1!==Infinity&&e.diasAte1<=7)add(p.id,'warn',`Sair em ~${Math.ceil(e.diasAte1)} dias`);
      if(e.u<LEVE){const d=dias(e.occ[0].entrada,ref);if(d>=MAXLEVE)add(p.id,'warn',`Gado leve há ${d} dias: trocar e fazer corte`)}
      {const v=[];for(const x of e.occ)for(const k of catsHoje(x,ref))if(dias(k.pes,ref)>DIAS_PESAGEM)v.push(`${k.c.toLowerCase()} (${dias(k.pes,ref)} d)`);if(v.length)add(p.id,'warn',`Pesar: ${v.join(', ')}`)}
      if(ul&&ul.agua==='seca')add(p.id,'bad','Sem água');
      if(p.semAguaSeca&&e.ep==='seca')add(p.id,'bad','Pasto sem água na seca: mudar o lote');
      {const x=supAtivo(p.id,PER);if(x){const t=supTxt(x);if(t.tipo!=='info')add(p.id,t.tipo,t.txt)}}
      if(foraEpoca(e.sup,e.ep))add(p.id,'warn',`Suplemento ${e.sup.nome} é para ${USO[e.sup.uso].toLowerCase()}`);
      if(ul&&ul.situacao==='reforma')add(p.id,'bad','Pasto em reforma com gado');
      const sx=e.occ.map(sexo).join('');
      if(sx.includes('M')&&sx.includes('F'))add(p.id,'bad','Macho e fêmea no mesmo pasto');
      for(const v of p.viz){const o=ocupantes(v,ref,PER);if(o.length){const sv=o.map(sexo).join('');if(choca(sx,sv))add(p.id,'bad',`Divisa proibida com ${nm(v)}`)}}
    }
  }
  return A;
}
function corteAguardando(PER){
  // pastos que tiveram lote leve (<1 UA/ha) por 60 dias ou mais no último período e estão vazios
  const ref=hoje(),set={};
  for(const x of estadas(PER)){if(x.fim===null||!P[x.pasto])continue;const d=dias(x.ini,x.fim);if(d<MAXLEVE)continue;
    const u=uaSeg(x.prim,x.prim.ini)/P[x.pasto].area;if(u>=LEVE)continue;
    if(ocupantes(x.pasto,ref,PER).length)continue;
    const depois=PER.some(y=>y.pasto===x.pasto&&y.ini>=x.fim);if(depois)continue;
    set[x.pasto]=x.fim}
  return set;
}

// ---------- sugestão de destino ----------
// mov: categorias que vão ({c:{q,w,g}} com peso na data); resto: o que fica no pasto de saída; outros: destinos já escolhidos
function sugerir(mov,de,resto,data,PER,outros){
  let U=0;for(const k of Object.values(mov))U+=k.q*k.w;U/=450;
  const sx=sexoCats(mov),sxResto=sexoCats(resto),corte=corteAguardando(PER),out=[];
  if(U<=0)return out;
  for(const p of PASTOS){
    if(p.naoRecebe||p.id===de||(outros||[]).includes(p.id))continue;
    if(ocupantes(p.id,data,PER).length)continue;
    const ul=ultimaLeitura(p.id);
    if(ul&&(ul.situacao==='reforma'||ul.agua==='seca'))continue;
    if(p.semAguaSeca&&epocaEm(data)==='seca')continue;
    const e=estado(p.id,PER,data);
    if(e.adubo&&e.adubo.libera>data)continue;
    if(e.passado&&!temVacasCats(mov))continue;
    const emCorte=p.id in corte;
    if(e.lv<4.5&&!emCorte)continue;
    if(p.viz.some(v=>choca(sx,v===de?sxResto:ocupantes(v,data,PER).map(sexo).join(''))))continue;
    const uh=U/p.area;
    if(emCorte&&uh<=PESADO)continue;
    const q=C*uh-e.r.g, dur=q>0?(e.lv-1)/q:Infinity;
    const mesmoBloco=p.id.split(/[.\s]/)[0]===de.split(/[.\s]/)[0];
    let score=emCorte?-1000:(dur===Infinity?p.area:1000-dur);
    if(!mesmoBloco)score+=10;
    if(e.passado)score+=500;
    out.push({id:p.id,uh,dur,emCorte,score,passado:e.passado});
  }
  return out.sort((a,b)=>a.score-b.score).slice(0,6);
}

// ---------- UI util ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
const txtMarcas=l=>marcas(l).map(v=>v==='adubado'&&l.aduboData?`adubado em ${dm(l.aduboData)} (+${l.aduboDias} d${l.aduboUA?`, ${f1(+l.aduboUA)} UA/ha, efeito ${l.aduboEf} d`:''})`:(MARCAS.find(m=>m[0]===v)||[v,v])[1].toLowerCase()).join(', ');
const f1=x=>x.toFixed(1).replace('.',','), f2=x=>x.toFixed(2).replace('.',',');
const nb=(x,d)=>(+x||0).toLocaleString('pt-BR',d===undefined?{maximumFractionDigits:2}:{minimumFractionDigits:d,maximumFractionDigits:d});
const fk=x=>Math.round(x).toLocaleString('pt-BR');
const dm=s=>{const [y,m,d]=s.split('-');return `${d}/${m}`};
function corNivel(lv){return lv>=4?'var(--ok)':lv>=2.5?'var(--accent)':lv>1.2?'var(--warn)':'var(--bad)'}
function fmtDias(x){if(x===null)return'';if(x===Infinity)return'Não precisa sair';return x<1?'hoje':`~${Math.round(x)} dias`}
function scaleHtml(id,val){let h=`<div class="scale" id="${id}" role="group">`;for(let i=0;i<=5;i++)h+=`<button type="button" data-v="${i}" aria-pressed="${val===i}">${i}</button>`;return h+'</div>'}
function segHtml(id,opts,val){return `<div class="seg" id="${id}" role="group">`+opts.map(([v,t])=>`<button type="button" data-v="${v}" aria-pressed="${val===v}">${t}</button>`).join('')+'</div>'}
function bindGroup(id,cb){const g=document.getElementById(id);g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb&&cb(b.dataset.v)})}
function groupVal(id){const b=document.querySelector(`#${id} button[aria-pressed="true"]`);return b?b.dataset.v:null}
const pastoOpts=(sel,filtro)=>PASTOS.filter(filtro||(()=>true)).map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.nome)} (${nb(p.area)} ha)</option>`).join('');

// ---------- telas ----------
let filtro='todos', busca='';
// cartão do pasto: esquerda = pasto e capim; direita = lote(s); embaixo = alertas
// última estada que terminou (pasto ficou vazio) antes de uma data
function ultimaEstada(pasto,antes,PER){let f=null;for(const x of estadas(PER,pasto))if(x.fim&&(!antes||x.fim<=antes)&&(!f||x.fim>f.fim))f=x;return f}
function barra(rot,v,sup){return `<span class="br"><span>${rot}</span><span class="bar"><i style="width:${v/5*100}%;background:${corNivel(v)}"></i></span><b>${f1(v)}${sup?'*':''}</b></span>`}
function cardPasto(p,e,a,PER,corte,ref){
  const occ=e.occ.length, chips=[...a];
  if(!occ&&!p.naoRecebe){
    if(!e.passado&&e.lv>=4.5){chips.push({tipo:'ok',txt:'Bom para entrar'});if(e.passaEm!==null)chips.push({tipo:'warn',txt:`Passa do ponto em ${e.passaEm} dia(s)`})}
  }
  if(e.fraco)chips.push({tipo:'warn',txt:'Capim fraco'});

  const cor=a.some(x=>x.tipo==='bad')?'var(--bad)':(a.length||(!occ&&e.passado))?'var(--warn)':occ?'var(--info)':corNivel(e.lv);
  const ul=e.ultima;
  const esq=`<div class="pcL"><div><span class="nm">${esc(p.nome)}</span> <span class="sub">(${String(p.area).replace('.',',')} ha, ${esc(p.capim||'')})</span>${p.semMapa?' <span class="sub">· sem vizinhos</span>':''}</div>
    ${barra('Altura',e.alt,e.suposto)}${barra('Rebrota',e.reb,e.suposto)}
    ${occ?`<div><b>${f2(e.u)}</b> UA/ha <span class="sub">(${f1(e.u*p.area)} UA)</span></div><div>${e.diasAte1===Infinity?'<b>Não precisa trocar</b>':`Trocar em <b>${fmtDias(e.diasAte1)}</b>`}</div>`:''}
    <div class="sub">${e.r.proprio?`ritmo ${Math.round(e.r.gBase/EP(e.ep).g*100)}% · `:''}${ul?'leitura '+dm(ul.data):'sem leitura'}</div></div>`;
  let dir;
  if(occ){dir=e.occ.map(x=>{const C2=catsHoje(x,ref),ini=x.entrada,us=ultimaEstada(p.id,ini,PER);
      const q=C2.reduce((s,k)=>s+k.q,0),kg=C2.reduce((s,k)=>s+k.kg,0);
      return `<div class="lt">${x.nome?esc(x.nome)+': ':''}${q} cab. (${fk(kg/q)} kg)</div>
      <div class="sub">Entrada ${dm(ini)}${ini===DATA.base?'*':''}${x.chegada>ini?`, última chegada ${dm(x.chegada)}`:''}${us?`, última saída ${dm(us.fim)}`:''}</div>
      ${C2.map(k=>`<div class="ct">${k.q} ${esc(k.c.toLowerCase())} <span class="sub">(${fk(k.peso)} kg, GMD ${f2(k.gmd)}, pesagem ${dm(k.pes)})</span></div>`).join('')}`}).join('<hr>')}
  else if(p.naoRecebe)dir=`<div class="lt muted">Corredor / curral</div>`;
  else{const us=ultimaEstada(p.id,null,PER);
    const tit=e.passado?['var(--warn)',e.talo?'Passado (muito talo): só vacas':'Passado: só vacas']:(p.id in corte)?['var(--info)','Aguardando corte rápido']:e.lv>=4.5?['var(--ok)','Vazio, pronto']:
      [corNivel(e.lv),`${e.alt<3&&e.reb>=3?'Rebrotando':e.alt<3?'Rapado':'Descansando'}, pronto em ${fmtDias(e.diasAte5)}`];
    dir=`<div class="lt" style="color:${tit[0]}">${tit[1]}</div><div class="sub">Aguenta até ${fk(e.r.g*12*p.area)} UA (${f1(e.r.g*12)} UA/ha)</div>
      ${us?`<div class="sub" style="margin-top:4px">Último: ${esc(us.nome||descSeg(us.prim))}, entrada ${dm(us.ini)}${us.ini===DATA.base?'*':''}, saída ${dm(us.fim)}</div>`:''}`}
  return `<button class="pc" data-p="${esc(p.id)}"><span class="stripe" style="background:${cor}"></span>${esq}<div class="pcR">${dir}</div>
    ${chips.length?`<div class="pcA">${chips.map(x=>`<span class="chip c-${x.tipo}">${esc(x.txt)}</span>`).join('')}</div>`:''}</button>`}

// ---------- aba Gado: mudança de pasto, nascimento, morte, mudança de categoria, venda, compra, pesagem e suplementação ----------
const CATEGORIAS=['Bezerros','Desmamas machos','Desmamas fêmeas','Desmamas','Garrotes','Novilhas','Bois',...VACAS,'CEIP','Potros','Tropa','Tropa chucra','Tropa adestrada'];
const TROPA=['Potros','Tropa','Tropa chucra','Tropa adestrada'];
const CAUSAS=[['raio','Raio'],['cobra','Cobra'],['doenca','Doença'],['parto','Parto'],['acidente','Acidente'],['naosei','Não sei'],['outra','Outra']];
// para onde cada categoria pode ir (definido pelo Diego); bezerros e desmamas antigas viram desmama macho ou fêmea
const PROX_CAT={'Desmamas machos':['Garrotes'],'Desmamas fêmeas':['Novilhas'],'Novilhas':['Vacas'],'Garrotes':['Bois','CEIP'],'Bois':['CEIP'],
  'Vacas':['Vacas cheias','Vacas vazias','Vacas descarte'],'Vacas cheias':['Vacas vazias','Vacas descarte'],'Vacas vazias':['Vacas cheias','Vacas descarte'],
  'CEIP':['Bois','Garrotes'],'Tropa':['Tropa chucra','Tropa adestrada'],'Tropa chucra':['Tropa adestrada'],'Potros':['Tropa','Tropa chucra','Tropa adestrada']};
const SEXAR=['Bezerros','Desmamas'];
const pesoNasc=c=>c==='Potros'?+S.config.pesoNascPotro||45:+S.config.pesoNasc||30, gmdNasc=c=>c==='Potros'?+S.config.gmdNascPotro||0.6:+S.config.gmdNasc||0.8;
const GMODOS=[['mudanca','Mudança de pasto'],['nascimento','Nascimento'],['morte','Morte'],['categoria','Mudar categoria'],['venda','Venda'],['compra','Compra'],['pesagem','Pesagem']];
const EM_BREVE=[];
// GMD real dos pesados: diferença entre o pesado e o estimado, dividida pelos dias desde a última pesagem (mínimo 15 dias)
const DIAS_GMD=15,DIAS_PESAGEM=90;
function pesagemCalc(k,d,peso){const dd=dias(k.pes,d);let g=k.g;if(dd>=DIAS_GMD)g=Math.max(-0.5,Math.min(2,k.g+(peso-k.w)/dd));return{g,dd,dif:peso-k.w}}
// rendimento de carcaça: fêmeas e demais categorias um valor; machos por faixa de peso vivo (Administrador › Configurações)
const MACHO_REND=[...MALE,'Desmamas machos'];
const rendTab=()=>S.config.rend||{f:50,m:[[450,50],[510,51],[570,52]],acima:53};
function rendSug(c,peso){const T=rendTab();if(!MACHO_REND.includes(c))return{r:T.f,txt:'fêmeas e demais categorias'};
  let ant=0;for(const [ate,r] of T.m){if(peso<=ate)return{r,txt:ant?`machos de ${ant} a ${ate} kg`:`machos até ${ate} kg`};ant=ate}
  return{r:T.acima,txt:`machos acima de ${ant} kg`}}
const arrobasCarc=(peso,rend)=>peso*rend/100/15;
const brl=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
// valor total do lançamento (só o administrador vê)
const valorEv=e=>e.tipo==='venda'?(e.preco&&e.rend?e.qtd*arrobasCarc(e.peso,e.rend)*e.preco:null):e.tipo==='compra'&&e.valor?e.valor:null;
let gadoModo='mudanca',gadoPasto=null,gadoData=null,gadoPre=null;
// morte: pasto e categoria começam em branco (o usuário escolhe); ficam escolhidos depois de salvar, só a quantidade é apagada
let morteP=null,morteCat=null;
const TIPOS_GADO=['nascimento','morte','categoria','venda','compra','pesagem'];
const estornados=()=>new Set(S.eventos.filter(e=>e.tipo==='estorno').map(e=>e.ref));
const eventosValidos=()=>{const x=estornados();return S.eventos.filter(e=>e.tipo!=='estorno'&&!x.has(e.id))};
// primeiro lançamento (mudança ou evento de gado) depois da data que envolve algum destes pastos
function lancDepois(pastos,dt){
  const m=S.mudancas.find(m=>m.data>dt&&(pastos.includes(m.de)||itensMud(m).some(it=>pastos.includes(it.para))));if(m)return m;
  return eventosValidos().find(e=>TIPOS_GADO.includes(e.tipo)&&e.data>dt&&pastos.includes(e.pasto))||null}
const catQ=(c,q)=>q===1?c.toLowerCase().split(' ').map(w=>w.replace(/s$/,'')).join(' '):c.toLowerCase();
function descEvento(e){
  if(e.tipo==='nascimento')return`${e.qtd} ${catQ(e.cat||'Bezerros',e.qtd)} (${f1(e.peso)} kg)`;
  if(e.tipo==='morte')return`${e.qtd} ${catQ(e.cat,e.qtd)} · causa: ${(CAUSAS.find(c=>c[0]===e.causa)||['',e.causa])[1].toLowerCase()}`;
  if(e.tipo==='categoria')return e.itens.map(it=>`${it.q} ${catQ(e.de,it.q)} → ${catQ(it.para,it.q)}`).join(', ');
  if(e.tipo==='venda')return`${e.qtd} ${catQ(e.cat,e.qtd)} (${f1(e.peso)} kg)${e.preco!=null?` · @ R$ ${f2(e.preco)}`:''}${e.rend!=null?` · rend. ${f1(e.rend)}%`:''}${e.quem?' · comprador: '+e.quem:''}`;
  if(e.tipo==='supProg'){const s=supDe(e.sup);return`${s?s.nome:'suplemento'} · ${fk(e.kgDia)} kg/dia`}
  if(e.tipo==='supFim')return'encerrado';
  if(e.tipo==='supRota'){const G={};for(const it of e.itens)(G[it.rota]=G[it.rota]||[]).push(it);return`${e.dias} dias · `+Object.entries(G).map(([r,I])=>`${r}: ${I.sort((a,b)=>a.ordem-b.ordem).map(it=>nm(it.pasto)+' '+it.levar).join(', ')} (${I.reduce((s,it)=>s+it.levar,0)} sacos)`).join('; ')}
  if(e.tipo==='supEntrega')return`tinha ${e.deposito} sacos no depósito (app estimava ${e.estimado}), deixou ${e.deixados}${e.prob&&e.prob.length?' · problemas: '+e.prob.join(', '):''}`;
  if(e.tipo==='suplemento'){const s=supDe(e.sup);return e.sup?`${s?s.nome:'suplemento'}${s?` (${f2(s.pct)}% do peso vivo)`:''}`:'encerrou a suplementação'}
  if(e.tipo==='pesagem')return e.itens.map(it=>`${it.n} ${catQ(it.cat,it.n)}: ${f1(it.peso)} kg (estimado ${f1(it.est)}, GMD ${f2(it.gmd)})`).join('; ');
  if(e.tipo==='compra')return`${e.qtd} ${catQ(e.cat,e.qtd)} (${f1(e.peso)} kg, GMD ${f2(e.gmd)})${e.quem?' · fornecedor: '+e.quem:''}`;
  return''}
// prazo para estornar sem senha: morte = 7 dias depois de registrada; demais = 7 dias depois da data do fato
const prazoEst=e=>e.tipo==='morte'?Date.now()-e.criado<=7*864e5:dias(e.data,hoje())<=7;
const ROT_EV={nascimento:'Nascimento',morte:'Morte',categoria:'Categoria',venda:'Venda',compra:'Compra',pesagem:'Pesagem',suplemento:'Suplementação',supProg:'Suplemento no pasto',supEntrega:'Entrega de suplemento',supFim:'Suplemento encerrado',supRota:'Rota de suplemento'};
function renderGado(){
  if(!pode(GADO_P[gadoModo])){const k=GMODOS.find(([m])=>pode(GADO_P[m]));if(k){gadoModo=k[0];gadoPre=null}}
  if(gadoModo==='mudanca')return renderMudanca();
  renderEvento(gadoModo)}
function gadoCorpo(){
  $('#tab-mudanca').innerHTML=`<h2>Gado</h2><div class="vizpick" id="gChips" style="border:0;padding:0;margin-bottom:12px;max-height:none">${GMODOS.filter(([k])=>pode(GADO_P[k])).map(([k,n])=>`<button type="button" data-gm="${k}" aria-pressed="${k===gadoModo}" ${EM_BREVE.includes(k)?'disabled style="opacity:.45" title="Na próxima parte"':''}>${n}</button>`).join('')}</div><div id="gBody"></div>`;
  document.querySelectorAll('#gChips [data-gm]').forEach(b=>b.onclick=()=>{if(b.disabled)return;gadoModo=b.dataset.gm;if(gadoModo==='morte')morteP=morteCat=null;renderGado()});
  return $('#gBody')}
function renderEvento(modo){
  const PER=periodos(),dt=gadoData&&gadoData<=hoje()?gadoData:hoje(),pre=gadoPre&&gadoPre.modo===modo?gadoPre:null;
  const ocup=modo==='compra'?PASTOS.filter(p=>!p.naoRecebe):PASTOS.filter(p=>ocupantes(p.id,dt,PER).length);
  const body=gadoCorpo();
  if(!ocup.length){body.innerHTML='<p class="muted">Nenhum pasto com gado nesta data.</p>';return}
  let pasto;if(modo==='morte'){pasto=pre&&ocup.some(p=>p.id===pre.pasto)?pre.pasto:ocup.some(p=>p.id===morteP)?morteP:'';morteP=pasto||null}
  else{pasto=pre&&ocup.some(p=>p.id===pre.pasto)?pre.pasto:ocup.some(p=>p.id===gadoPasto)?gadoPasto:ocup[0].id;gadoPasto=pasto}
  const seg=pasto?ocupantes(pasto,dt,PER):[],cats={};for(const x of seg)for(const k of catsHoje(x,dt)){const t=cats[k.c]=cats[k.c]||{q:0,kg:0,g:0,pes:k.pes};t.q+=k.q;t.kg+=k.kg;t.g+=k.q*k.gmd;if(k.pes<t.pes)t.pes=k.pes}

// ---------- suplementação: programação (admin) → relatório do tratorista → entregas → previsão de término ----------
const SACO=s=>+(s&&s.saco)||20;
const evOrd=(a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criado||0)-(b.criado||0);

let _supC={},_supK='';
// programações do pasto com o estoque simulado dia a dia a partir das entregas
function supInfo(pasto,PER){
  const key=_perKey+'|'+S.eventos.length+'|'+(S.eventos.length?S.eventos[S.eventos.length-1].id:'')+'|'+(S.config.alterado||0)+'|'+hoje();
  if(_supK!==key){_supC={};_supK=key}if(_supC[pasto])return _supC[pasto];
  const X=estornados(),EV=S.eventos.filter(e=>!X.has(e.id)&&e.pasto===pasto);
  const PR=EV.filter(e=>e.tipo==='supProg').sort(evOrd),est=estadas(PER,pasto),out=[],h=hoje();
  PR.forEach((p,i)=>{const s=supDe(p.sup);if(!s)return;
    const st=est.find(x=>(x.ini<=p.data||x.ini===DATA.base)&&(x.fim===null||x.fim>p.data));
    let fim=PR[i+1]?PR[i+1].data:'9999-12-31';if(!st)fim=p.data;else if(st.fim&&st.fim<fim)fim=st.fim;
    const en=EV.find(e=>e.tipo==='supFim'&&e.prog===p.id);if(en&&en.data<fim)fim=en.data;
    const E=EV.filter(e=>e.tipo==='supEntrega'&&e.prog===p.id).sort(evOrd),kgS=SACO(s);
    const iv=[];let stock=null,ini=null,ei=0,hojeKg=null,fimPrev=null;const lim=fim<addD(h,400)?fim:addD(h,400);
    if(E.length)for(let d=E[0].data;d<lim;d=addD(d,1)){
      while(ei<E.length&&E[ei].data===d){const e=E[ei];stock=(e.deposito+e.deixados)*kgS;fimPrev=null;ei++}
      if(d===h)hojeKg=stock;
      if(stock>0){if(ini===null)ini=d;stock-=kgSupDia(pasto,d,PER,s);if(stock<=0){stock=0;iv.push([ini,addD(d,1)]);ini=null;fimPrev=addD(d,1)}}}
    if(ini!==null)iv.push([ini,lim]);

function supTxt(x){const sac=v=>Math.round(v/x.kgS);

  if(!(x.hojeKg>0))return{tipo:'bad',txt:`Suplemento ${x.s.nome} acabou${x.fimPrev?' em '+dm(x.fimPrev):''}`};
  const n=x.fimPrev?dias(hoje(),x.fimPrev):null;
  return{tipo:n!==null&&n<=5?'warn':'info',txt:`Suplemento ${x.s.nome}: ${sac(x.hojeKg)} sacos no cocho, ${n===null?'dura mais de um ano':`acaba em ${n} dia${n===1?'':'s'} (${dm(x.fimPrev)})`}`}}

function supLevar(x,n){const need=x.kgDia*n-(x.hojeKg||0);return Math.max(0,Math.ceil(need/x.kgS))}

// ---------- mudança de gado: do pasto de saída, quantos de cada categoria, para um ou mais pastos ----------
let mudPasto=null, mudData=null, mudDest=[], forcar=false, semMedir='';
const novoDest=()=>({k:uid(),para:'',qtd:{},nome:'',ea:null,er:null});
function movDe(cats,qtd){const m={};for(const k of cats){const n=Math.min(k.q,Math.max(0,parseInt(qtd[k.c])||0));if(n>0)m[k.c]={q:n,w:k.peso,g:k.gmd}}return m}
const somaCats=(a,b)=>{const m={};for(const x of [a,b])for(const [c,k] of Object.entries(x)){const o=m[c];if(o){const n=o.q+k.q;o.w=(o.w*o.q+k.w*k.q)/n;o.g=(o.g*o.q+k.g*k.q)/n;o.q=n}else m[c]={...k}}return m};
const catsDeSeg=(seg,dt)=>{const m={};for(const k of catsHoje(seg,dt))m[k.c]={q:k.q,w:k.peso,g:k.gmd};return m};
const uaCats=m=>Object.values(m).reduce((s,k)=>s+k.q*k.w,0)/450;
const cabCats=m=>Object.values(m).reduce((s,k)=>s+k.q,0);
function renderMudanca(){

   <div class="muted" style="font-size:13px">${seg.nome?'<b>'+esc(seg.nome)+'</b>: ':''}${esc(descSeg(seg))} · ${f1(uaSeg(seg,dt))} UA. No ${esc(nm(de))} desde ${br(seg.entrada)}. Capim estimado: altura ${f1(e.alt)}, rebrota ${f1(e.reb)}.</div>
   <fieldset class="card stack" style="border-color:var(--line)"><legend style="font-weight:700;padding:0 6px">Pasto ${esc(nm(de))} ao sair</legend>
     <div><label>Altura</label>${scaleHtml('sAlt',null)}</div>
     <div><label>Rebrota</label>${scaleHtml('sReb',null)}</div>
   </fieldset>

      b.querySelector('.dPara').onchange=atualizar;
      const rm=b.querySelector('[data-rem]');if(rm)rm.onclick=()=>{ler();mudDest=mudDest.filter(x=>x.k!==d.k);desenhar()}}
    atualizar()};
  // há quantos dias o destino está sem gado e com que rebrota o último gado saiu
  const infoVazio=(p,dtv)=>{if(ocupantes(p,dtv,PER).length)return'';const u=ultimaEstada(p,dtv,PER);
    if(!u)return`<br>Sem gado desde antes de ${br(DATA.base)} (início do controle no app).`;
    const L=leiturasDe(p).filter(l=>l.data===u.fim),ls=L.find(l=>l.origem==='mudanca'&&l.obs==='Saída de gado')||L[L.length-1];
    const n=dias(u.fim,dtv);return`<br>Sem gado há ${n} dia${n===1?'':'s'} (saída em ${br(u.fim)}). ${ls?`Na saída: altura ${ls.altura}, rebrota ${ls.rebrota}.`:'Altura e rebrota na saída: não medidas.'}`};
  // divisas do destino com cada vizinho, considerando o que fica no pasto de saída e os outros destinos
  const infoDivisas=(d,mov,ex,r,dtv)=>{const p=d.para,viz=P[p].viz;
    if(!viz.length)return`<br><span style="color:var(--info,inherit)">ℹ️ O ${esc(nm(p))} ainda não tem vizinhos cadastrados; divisas não conferidas.</span>`;
    const comp=x=>{const dd=mudDest.find(y=>y.para===x);if(!dd)return null;const e2=ocupantes(x,dtv,PER);return somaCats(movDe(cats,dd.qtd),e2.length?catsDeSeg(e2[0],dtv):{})};
    const sx=sexoCats(somaCats(mov,ex.length?catsDeSeg(ex[0],dtv):{}));
    const ruins=[],ok=[];
    for(const v of viz){let s2,txt;
      if(v===de){s2=sexoCats(r);txt=cabCats(r)?'ficam '+descCats(r):'vazio'}
      else if(comp(v)){const c2=comp(v);s2=sexoCats(c2);txt=descCats(c2)+', chegando'}
      else{const o=ocupantes(v,dtv,PER);s2=o.map(sexo).join('');txt=o.length?o.map(x=>(x.nome?x.nome+': ':'')+descSeg(x)).join(' + '):'vazio'}

  // recalcula resumo, sugestões e conferência sem redesenhar (mantém o foco do teclado)

    for(const d of mudDest){const b=document.getElementById('d_'+d.k),mov=movDe(cats,d.qtd);
      b.querySelector('.dSum').textContent=cabCats(mov)?`Levando ${cabCats(mov)} cab., ${f1(uaCats(mov))} UA`:'Nenhum animal escolhido.';
      const sg=cabCats(mov)?sugerir(mov,de,r,dtv,PER,outros.filter(x=>x!==d.para)):[];
      const sb=b.querySelector('.dSug');sb.innerHTML=!cabCats(mov)?'<span class="muted">Escolha quantos animais levar.</span>':sg.length?sg.map(s=>`<button type="button" data-p="${esc(s.id)}">${esc(nm(s.id))} · ${f2(s.uh)} UA/ha · ${s.passado?'passado, ':''}${s.emCorte?'corte rápido':(s.dur===Infinity?'pode ficar':'~'+Math.round(s.dur)+' dias')}</button>`).join(''):'<span class="muted">Nenhum pasto vazio e pronto que respeite as divisas. Escolha manualmente.</span>';
      sb.querySelectorAll('button').forEach(x=>x.onclick=()=>{b.querySelector('.dPara').value=x.dataset.p;atualizar()});
      const ex=d.para?ocupantes(d.para,dtv,PER):[];
      b.querySelector('.dInfo').innerHTML=d.para?(ex.length?`O ${esc(nm(d.para))} já tem ${esc((ex[0].nome?ex[0].nome+': ':'')+descSeg(ex[0]))}. O gado vai se juntar e o peso médio de cada categoria é recalculado.`:`O ${esc(nm(d.para))} está vazio.`)+infoVazio(d.para,dtv)+infoDivisas(d,mov,ex,r,dtv):'';
      b.querySelector('.dNomeBox').hidden=!!ex.length}
    const nr=cabCats(r);$('#mResto').textContent=nr?`Ficam no ${nm(de)}: ${descCats(r)}.`:`O ${nm(de)} fica vazio.`;
    checar()};
  const checar=()=>{const dtv=$('#mData').value||hoje(),r=resto(),av=$('#mAv'),avisos=[];forcar=false;semMedir='';$('#mBtn').textContent='Salvar mudança';
    const comp={};for(const d of mudDest)if(d.para){const ex=ocupantes(d.para,dtv,PER);comp[d.para]=somaCats(movDe(cats,d.qtd),ex.length?catsDeSeg(ex[0],dtv):{})}
    const sxDe=v=>v===de?sexoCats(r):comp[v]?sexoCats(comp[v]):ocupantes(v,dtv,PER).map(sexo).join('');
    for(const d of mudDest){if(!d.para||!cabCats(movDe(cats,d.qtd)))continue;const sx=sexoCats(comp[d.para]),mov=movDe(cats,d.qtd);

      const e2=estado(d.para,PER,dtv);if(!ocupantes(d.para,dtv,PER).length&&e2.lv<4.5&&!(d.para in corteAguardando(PER)))avisos.push(`O capim do ${nm(d.para)} está estimado em altura ${f1(e2.alt)} e rebrota ${f1(e2.reb)}; o ideal é entrar com 5.`);
      if(e2.passado&&!temVacasCats(mov))avisos.push(`O ${nm(d.para)} está passado: indicado só para vacas.`)}
    if(avisos.length){av.className='note warn';av.innerHTML='<b>Confira antes de salvar:</b><br>'+[...new Set(avisos)].map(esc).join('<br>');av.hidden=false;forcar=true;$('#mBtn').textContent='Salvar mesmo assim'}
    else if(mudDest.some(d=>d.para)){av.className='note ok';av.textContent='Tudo certo com as divisas e os pastos de destino.';av.hidden=false}else av.hidden=true};

    if(sa!==null)S.leituras.push({id:uid(),criado:t,user:SES.id,data:dtv,pasto:de,altura:+sa,rebrota:+sr,agua:(ultimaLeitura(de)||{}).agua||'tem',situacao:'normal',obs:'Saída de gado',origem:'mudanca',mudanca:id});

    save();atualizaTopo();mudDest=[];toast(`Mudança salva: ${nm(de)} → ${itens.map(it=>nm(it.para)).join(', ')}`);renderMudanca()};
}

// ---------- histórico: linha do tempo, capim, ciclos e comparação ----------
const HIST_PER=[[180,'180 dias'],[365,'365 dias'],[730,'2 anos'],[1460,'4 anos']];
let histDias=180;
function histDados(p,PER,N){
  const fim=hoje(),ini0=addD(fim,-N+1),ini=ini0<DATA.base?DATA.base:ini0,T=dias(ini,fim)+1;
  const D=[];for(let k=0;k<T;k++){const d=addD(ini,k),o=ocupantes(p,d,PER);D.push({d,uh:o.reduce((s,x)=>s+uaSeg(x,d),0)/P[p].area,k:o.map(x=>x.gid+'@'+x.ini).join('|')})}
  const runs=[];let cur=null;
  for(const x of D){if(x.uh>0){if(!cur){cur={ent:x.d,sai:null,dias:0,soma:0};runs.push(cur)}cur.dias++;cur.soma+=x.uh}else if(cur){cur.sai=x.d;cur=null}}
  const L=leiturasDe(p);
  const leit=(d,obs)=>{const l=L.filter(x=>x.data===d);return l.find(x=>x.obs===obs)||l[l.length-1]||null};
  runs.forEach((r,i)=>{r.uh=r.soma/r.dias;const o=ocupantes(p,r.ent,PER);r.gado=o.map(x=>(x.nome?x.nome+': ':'')+descSeg(x)).join(' + ');
    r.antes=r.ent===DATA.base&&ocupantes(p,DATA.base,PER).some(x=>x.ini===DATA.base);
    r.le=leit(r.ent,'Entrada de gado');r.ls=r.sai?leit(r.sai,'Saída de gado'):null;
    r.desc=r.sai?(runs[i+1]?dias(r.sai,runs[i+1].ent):null):null;r.descAte=r.sai&&!runs[i+1]?dias(r.sai,fim):null});
  const occ=D.filter(x=>x.uh>0),gaps=runs.filter(r=>r.desc!==null).map(r=>r.desc);
  const res={T,ini,ini0,pct:occ.length/T,uh:occ.length?occ.reduce((s,x)=>s+x.uh,0)/occ.length:0,ent:runs.filter(r=>!r.antes).length,
    ocup:runs.length?runs.reduce((s,r)=>s+r.dias,0)/runs.length:0,desc:gaps.length?gaps.reduce((a,b)=>a+b,0)/gaps.length:null,carga:D.reduce((s,x)=>s+x.uh,0)};
  return{D,runs,L:L.filter(l=>l.data>=ini),res,fim}}
function histLinha(H,p){
  const {D,runs,L,res,fim}=H,T=res.T,W=Math.max(360,Math.round(360*T/365)),x=d=>dias(res.ini,d)*W/T,w=Math.max(1,W/T);

  let a=0;while(a<D.length){let b=a;const oc=D[a].uh>0;while(b+1<D.length&&(D[b+1].uh>0)===oc&&D[b+1].k===D[a].k)b++;let um=0;for(let j=a;j<=b;j++)um+=D[j].uh;um/=b-a+1;
    const i=segs.length;segs.push(oc?`${br(D[a].d)} a ${br(D[b].d)} (${b-a+1} dia${b>a?'s':''}): ${f2(um)} UA/ha · ${ocupantes(p,D[a].d,periodos()).map(s=>(s.nome?s.nome+': ':'')+descSeg(s)).join(' + ')}`:`${br(D[a].d)} a ${br(D[b].d)}: descanso (${b-a+1} dia${b>a?'s':''})`);
    h+=`<rect data-i="${i}" x="${(a*w).toFixed(2)}" y="16" width="${((b-a+1)*w).toFixed(2)}" height="26" fill="${oc?'var(--ok)':'var(--line)'}" opacity="${oc?Math.min(1,.35+um/4*.65).toFixed(2):.8}"><title>${esc(segs[i])}</title></rect>`;a=b+1}
  for(const r of runs)if(!r.antes)h+=`<text x="${x(r.ent)}" y="12" font-size="10" text-anchor="middle" fill="var(--ink)">▼</text>`;
  for(const l of L)h+=`<circle cx="${(x(l.data)+w/2).toFixed(1)}" cy="50" r="3" fill="var(--info)"><title>Leitura ${br(l.data)}: altura ${l.altura}, rebrota ${l.rebrota}</title></circle>`;
  const ticks=[res.ini,addD(res.ini,Math.floor(T/2)),fim];
  h+=ticks.map((d,i)=>`<text x="${i===0?0:i===2?W:x(d)}" y="68" font-size="10" text-anchor="${i===0?'start':i===2?'end':'middle'}" fill="var(--muted)">${i===2?'hoje':br(d).slice(0,5)}</text>`).join('');
  return{svg:`<div style="overflow-x:auto"><svg viewBox="0 0 ${W} 72" style="width:${W>360?Math.round(W/360*100):100}%;min-width:100%;display:block">${h}</svg></div>`,segs}}
function histCapim(H,p,PER){
  const {res,L,fim}=H,T=res.T,W=360,Y=v=>10+(5-v)*20,x=d=>T>1?dias(res.ini,d)*W/(T-1):W/2,k=Math.max(1,Math.ceil(T/120));
  const pts=[];for(let i=0;i<T;i+=k)pts.push(addD(res.ini,i));if(pts[pts.length-1]!==fim)pts.push(fim);
  const E=pts.map(d=>({d,e:estado(p,PER,d)}));
  const pl=f=>E.map(q=>`${x(q.d).toFixed(1)},${Y(f(q.e)).toFixed(1)}`).join(' ');
  let h=`<rect x="0" y="${Y(5)}" width="${W}" height="${Y(4.5)-Y(5)}" fill="var(--ok)" opacity=".18"/><rect x="0" y="${Y(1)}" width="${W}" height="${Y(0)-Y(1)}" fill="var(--bad)" opacity=".14"/>`;

  h+=`<polyline points="${pl(e=>e.alt)}" fill="none" stroke="var(--info)" stroke-width="2"/><polyline points="${pl(e=>e.reb)}" fill="none" stroke="var(--ok)" stroke-width="2" stroke-dasharray="5 4"/>`;
  for(const l of L){h+=`<circle cx="${x(l.data).toFixed(1)}" cy="${Y(l.altura)}" r="3.5" fill="var(--info)"><title>Leitura ${br(l.data)}: altura ${l.altura}</title></circle><circle cx="${x(l.data).toFixed(1)}" cy="${Y(l.rebrota)}" r="3.5" fill="var(--surface)" stroke="var(--ok)" stroke-width="2"><title>Leitura ${br(l.data)}: rebrota ${l.rebrota}</title></circle>`}
  h+=`<text x="${W-2}" y="${Y(5)-2}" font-size="9" text-anchor="end" fill="var(--muted)">ponto de entrada</text><text x="${W-2}" y="${Y(0)-3}" font-size="9" text-anchor="end" fill="var(--muted)">ponto de saída</text>`;
  h+=`<text x="0" y="${Y(0)+14}" font-size="10" fill="var(--muted)">${br(res.ini).slice(0,5)}</text><text x="${W}" y="${Y(0)+14}" font-size="10" text-anchor="end" fill="var(--muted)">hoje</text>`;
  return`<svg viewBox="-14 0 ${W+16} ${Y(0)+18}" style="width:100%;display:block">${h}</svg>
   <p class="muted" style="font-size:12px;margin:2px 0 0"><span style="color:var(--info)">━ altura</span> · <span style="color:var(--ok)">╍ rebrota</span> (estimativa do app) · <span style="color:var(--info)">●</span> <span style="color:var(--ok)">○</span> leituras de campo</p>`}

      let nu=0;for(const u of (o.usuarios||[])){const i=S.usuarios.findIndex(y=>y.id===u.id);if(i<0){S.usuarios.push(u);nu++}else if((u.alterado||0)>(S.usuarios[i].alterado||0)){S.usuarios[i]=u;nu++}}
      const gi=new Set(S.log.map(x=>x.id));const ng=(o.log||[]).filter(x=>!gi.has(x.id));S.log.push(...ng);
      const ah=o.config&&(o.config.adminTs||0)>(S.config.adminTs||0)?o.config:S.config;
      if(o.config&&(o.config.alterado||0)>(S.config.alterado||0))S.config=o.config;
      if(ah.adminTs){S.config.adminHash=ah.adminHash;S.config.adminTs=ah.adminTs}
  montarPastos();save();return{nl,nm,nc,no,nu}}

// envia tudo deste celular, recebe o que os outros mandaram (vale o que chegou primeiro),
// sobe as fotos novas para o Drive e reescreve as abas da planilha
const sincCfg=()=>S.config.sinc||{};
let dadosSincAgora=false,_sincRodando=false,_sincTimer=null;
const FOTOS_ENV=KEY+'.fotosEnv';
const fotosEnviadas=()=>{try{return new Set(JSON.parse(localStorage.getItem(FOTOS_ENV)||'[]'))}catch(e){return new Set()}};
const CHAVE_ADM=KEY+'.chaveAdm';
const chaveAdm=()=>{try{return localStorage.getItem(CHAVE_ADM)||''}catch(e){return''}};
async function postSinc(o){const c=sincCfg(),ka=isAdmin()?chaveAdm():'',r=await fetch(c.url,{method:'POST',body:JSON.stringify({chave:c.chave,...(ka?{chaveAdm:ka}:{}),...o})});
  if(!r.ok)throw new Error('A planilha respondeu com erro '+r.status+'.');const j=await r.json();if(!j.ok)throw new Error(j.erro||'Erro na planilha.');return j}
// lançamentos que a planilha marcou em conflito e o administrador ainda não aceitou
function emConflito(){const ok=new Set(S.eventos.filter(e=>e.tipo==='conflitoOk').map(e=>e.ref));
  return new Set([...S.mudancas,...S.eventos].filter(x=>x.conflito&&!ok.has(x.id)).map(x=>x.id))}
const conflitosPend=()=>{const fe=new Set(S.eventos.filter(e=>e.tipo==='conflitoOk'||e.tipo==='conflitoNao').map(e=>e.ref));return[...S.mudancas,...S.eventos].filter(x=>x.conflito&&!fe.has(x.id))};
const descMud=m=>`${nm(m.de)} → ${itensMud(m).map(it=>nm(it.para)+(it.todos?' (todo o lote)':': '+Object.entries(it.qtd||{}).filter(([c,q])=>q>0).map(([c,q])=>q+' '+c.toLowerCase()).join(', '))).join('; ')}`;
const descLanc=x=>x.tipo?`${ROT_EV[x.tipo]||x.tipo} ${nm(x.pasto)}: ${descEvento(x)}`:'Mudança de pasto '+descMud(x);

async function sincronizar(manual){
  const c=sincCfg(),msg=t=>{if(manual)toast(t)};
  if(!c.url||!c.chave){msg('Planilha Google ainda não configurada (Administrador › Configurações).');return false}
  if(!navigator.onLine){msg('Sem internet. Os dados ficam guardados e sobem quando tiver sinal.');return false}
  if(_sincRodando)return false;_sincRodando=true;S.sincEst={rodando:true,ts:Date.now()};if(document.querySelector('#sincBox'))desenharSinc();
  try{
    const r=await postSinc({acao:'sinc',dev:DEV,user:SES.id,por:SES.nome,versao:VERSAO,pacote:JSON.parse(pacote())});
    importar(r.M);
    // fotos que ainda não subiram, de 6 em 6
    const env=fotosEnviadas(),ids=[];for(const x of [...S.ocorrencias,...S.eventos])for(const id of [...(x.fotos||[]),...(x.fotosRes||[])])if(!env.has(id))ids.push(id);
    let links=r.M.fotosLink||{};
    for(let i=0;i<ids.length;i+=6){const F={};for(const id of ids.slice(i,i+6)){const u=await fotoGet(id);if(u)F[id]=u;else env.add(id)}
      if(Object.keys(F).length){const f=await postSinc({acao:'fotos',fotos:F});links=f.fotosLink||links;for(const id of f.salvas)env.add(id)}
      try{localStorage.setItem(FOTOS_ENV,JSON.stringify([...env]))}catch(e){}}
    if(r.adm)await postSinc({acao:'planilha',abas:abasPlanilha(links)});
    S.sincEst={ok:true,ts:Date.now(),novos:r.novos,conf:r.conf,adm:!!r.adm};marcarCopia('planilha Google');
    if(manual||r.conf)toast(r.conf?`Sincronizado. ⚠ ${r.conf} lançamento(s) em conflito para o administrador revisar.`:'Sincronizado com a planilha');
    return true}
  catch(e){S.sincEst={erro:String(e&&e.message||e).replace('Failed to fetch','Não consegui falar com a planilha. Confira a internet e o endereço.'),ts:Date.now()};save();msg('Sincronização falhou: '+S.sincEst.erro);return false}
  finally{_sincRodando=false;atualizaTopo();if(document.querySelector('#sincBox'))desenharSinc()}}
// sincroniza sozinho: ao abrir o app, quando volta a internet e 30 s depois de um lançamento
function sincAuto(espera){const c=sincCfg();if(!c.url||!SES)return;clearTimeout(_sincTimer);_sincTimer=setTimeout(()=>{if(navigator.onLine)sincronizar(false)},espera||0)}
window.addEventListener('online',()=>sincAuto(2000));

// linhas de cada aba (com explicação das colunas no topo, como nas outras planilhas)
function abasPlanilha(links){
  const X=estornados(),fc=emConflito(),L=id=>links[id]||'',fotos=a=>(a||[]).map(L).filter(Boolean).join(' '),sit=x=>X.has(x.id)?'estornado':fc.has(x.id)?'em conflito':'';
  const ord=(a,b)=>a.data<b.data?-1:a.data>b.data?1:(a.criado||0)-(b.criado||0);
  const LIM=20000,cort=a=>a.slice(-LIM);
  return{
   'Lançamentos':{explica:['Tudo o que foi lançado nos celulares, um por linha (mais recentes por último).','Digitado em = dia e hora em que a pessoa lançou. Data do fato = dia a que o lançamento se refere. Usuário = quem lançou. Tipo = leitura, mudança, gado, ocorrência, suplementação, cadastro etc. O que foi lançado = o texto completo.'],
     cab:['Digitado em','Data do fato','Usuário','Tipo','O que foi lançado'],linhas:cort([...S.log].sort((a,b)=>a.ts-b.ts).map(l=>[fmtDT(l.ts),l.data?br(l.data):'',l.nome||nomeUser(l.user),l.tipo,l.texto]))},
   'Leituras':{explica:['Leituras de capim. Altura = quantidade de capim (0 a 5); Rebrota = folha nova, qualidade (0 a 5); não se faz média das duas.','Água = situação da aguada. Origem "mudanca" = leitura feita na entrada ou saída de gado.'],
     cab:['Data','Pasto','Altura','Rebrota','Água','Situação','Origem','Obs.','Usuário'],linhas:cort([...S.leituras].sort(ord).map(l=>[br(l.data),nm(l.pasto),l.altura,l.rebrota,l.agua||'',l.situacao||'',l.origem||'',l.obs||'',nomeUser(l.user)]))},
   'Mudanças de pasto':{explica:['Cada linha é uma mudança de gado entre pastos.','De = pasto de saída. Para = destino de cada parte do lote, com as quantidades. Saída/Entrada = notas de altura/rebrota anotadas na hora. Situação "em conflito" = outro celular já tinha lançado saída desse pasto; o administrador revisa no app.'],
     cab:['Data','De','Para','Saída (alt./reb.)','Obs.','Usuário','Situação'],linhas:cort([...S.mudancas].sort(ord).map(m=>[br(m.data),nm(m.de),itensMud(m).map(it=>nm(it.para)+(it.todos?' (todo o lote)':': '+Object.entries(it.qtd||{}).filter(([c,q])=>q>0).map(([c,q])=>q+' '+c.toLowerCase()).join(', '))).join('; '),m.saida?m.saida.altura+'/'+m.saida.rebrota:'',m.obs||'',nomeUser(m.user),sit(m)]))},
   'Gado':{explica:['Nascimentos, mortes, mudanças de categoria, vendas, compras e pesagens.','Tipo = o lançamento; Detalhe = quantidades, pesos, causa, valores. Valor de venda e compra aparece aqui (planilha do administrador). Situação: estornado = desfeito por lançamento ao contrário; em conflito = aguardando o administrador.'],
     cab:['Data','Pasto','Tipo','Detalhe','Obs.','Fotos','Usuário','Situação'],linhas:cort(S.eventos.filter(e=>TIPOS_GADO.includes(e.tipo)).sort(ord).map(e=>[br(e.data),nm(e.pasto),ROT_EV[e.tipo]||e.tipo,descEvento(e)+(e.valor?' · valor '+brl(e.valor):'')+(e.tipo==='venda'&&e.preco?' · @ '+brl(e.preco):''),e.obs||'',fotos(e.fotos),nomeUser(e.user),sit(e)]))},
   'Suplementação':{explica:['Suplemento por pasto, rotas planejadas e entregas.','Tipo: Suplemento no pasto (início), Suplemento encerrado, Rota (planejamento) e Entrega. Na entrega: sacos que havia no depósito, sacos deixados, problemas, observação, local (GPS) e fotos.'],
     cab:['Data','Pasto','Tipo','Detalhe','Problemas','Obs.','Local (GPS)','Fotos','Usuário','Situação'],linhas:cort(S.eventos.filter(e=>['supProg','supFim','supRota','supEntrega'].includes(e.tipo)).sort(ord).map(e=>[br(e.data),e.pasto?nm(e.pasto):'',ROT_EV[e.tipo]||e.tipo,descEvento(e),(e.prob||[]).join(', '),e.obs||'',e.local?mapsUrl(e.local):'',fotos(e.fotos),nomeUser(e.user),X.has(e.id)?'estornado':'']))},
   'Ocorrências':{explica:['Ocorrências registradas no campo.','Situação = aberta ou resolvida. Gravidade = baixa, média ou alta. Fotos = links para os arquivos no Google Drive.'],
     cab:['Data','Pasto','O que','Gravidade','Qtd.','Descrição','Situação','Local (GPS)','Fotos','Usuário'],linhas:cort([...S.ocorrencias].sort(ord).map(o=>[br(o.data),nm(o.pasto),o.tipo,o.gravidade||'',o.qtd||'',o.desc||'',o.status||'',o.local?mapsUrl(o.local):'',fotos([...(o.fotos||[]),...(o.fotosRes||[])]),nomeUser(o.user)]))},
   'Pastos':{explica:['Cadastro atual dos pastos (o administrador altera no app).','Área em hectares. Vizinhos = pastos que dividem cerca.'],

function desenharSinc(){const b=$('#sincBox');if(!b)return;const c=sincCfg(),e=S.sincEst||{},adm=isAdmin(),P=conflitosPend();
  b.innerHTML=!c.url?`<p class="muted" style="margin:0">A planilha ainda não foi configurada.${adm?' Configure em Administrador › Configurações › Planilha Google.':' Peça ao administrador.'}</p>`:
   `<dl class="kv"><dt>Última sincronização</dt><dd>${e.rodando?'sincronizando agora...':S.copia&&/planilha/.test(S.copia.como||'')?fmtDT(S.copia.ts):'ainda não'}</dd>
    ${e.erro?`<dt>Último erro</dt><dd style="color:var(--bad)">${esc(e.erro)} (${fmtDT(e.ts)})</dd>`:''}

    ${adm&&e.ok&&!e.adm?'<div class="note warn">Chave do administrador não configurada (ou errada) neste celular. Sem ela, cadastros, configurações e as abas da planilha não são atualizados por aqui. Configure em Administrador › Configurações › Planilha Google.</div>':''}
    <button class="btn wide" type="button" id="sincBtn" ${e.rodando?'disabled':''}>${e.rodando?'Sincronizando...':'Sincronizar agora'}</button>
    <p class="muted" style="font-size:12.5px;margin:0">Envia o que foi lançado neste celular e recebe o dos outros. Sincroniza sozinho ao abrir o app, quando volta a internet e depois de cada lançamento.</p>
    ${P.length?`<h3 style="margin:8px 0 0">Conflitos (${P.length})</h3><p class="muted" style="font-size:12.5px;margin:0">Outro celular já tinha lançado saída de gado desse pasto. Vale o que chegou primeiro: estes ficam fora das contas até o administrador decidir.</p>
     ${P.map(x=>{const o=[...S.mudancas,...S.eventos].find(y=>y.id===x.conflito.com);return`<div class="card stack" style="gap:6px"><div><b>${esc(nomeUser(x.user))}</b> · ${br(x.data)}: ${esc(descLanc(x))}</div>
       ${o?`<div class="muted" style="font-size:13px">Chegou antes: ${esc(nomeUser(o.user))} · ${br(o.data)}: ${esc(descLanc(o))}</div>`:''}
       ${adm?`<div class="row"><button class="btn sec" type="button" data-cok="${x.id}">Aceitar (vale também)</button><button class="btn sec" type="button" data-cno="${x.id}">Descartar</button></div>`:'<div class="muted" style="font-size:12.5px">Aguardando o administrador.</div>'}</div>`}).join('')}`:''}`;
  const bt=$('#sincBtn');if(bt)bt.onclick=()=>sincronizar(true);

    const E={id:uid(),criado:Date.now(),user:SES.id,data:hoje(),pasto:it.pasto||it.de||'',tipo:ok?'conflitoOk':'conflitoNao',ref:id};S.eventos.push(E);_perCache=null;
    registrar('gado',hoje(),`Conflito de sincronização ${ok?'aceito':'descartado'}: ${descLanc(it)}`,E.id);save();atualizaTopo();desenharSinc();sincAuto(1000)})}

// ---------- conflitos de vizinhança ----------
function conflitos(PER){
  const ref=hoje(),out=[],visto=new Set();
  for(const p of PASTOS){
    const o=ocupantes(p.id,ref,PER);if(!o.length)continue;
    const sx=o.map(sexo).join('');
    if(sx.includes('M')&&sx.includes('F'))out.push({tipo:'mesmo',a:p.id,la:o});
    for(const v of p.viz){const k=[p.id,v].sort().join('|');if(visto.has(k))continue;visto.add(k);
      const ov=ocupantes(v,ref,PER);if(!ov.length)continue;
      if(choca(sx,ov.map(sexo).join('')))out.push({tipo:'divisa',a:p.id,la:o,b:v,lb:ov})}
  }
  return out;
}
function renderVizinhanca(){
  const PER=periodos(),C2=conflitos(PER);
  const lote=L=>L.map(x=>{const sx=sexo(x);return `${x.nome?'<b>'+esc(x.nome)+'</b> · ':''}${esc(descSeg(x))} <span class="chip ${sx.includes('M')?'c-info':'c-warn'}">${sx==='M'?'macho':sx==='F'?'fêmea':sx==='MF'?'misto':'livre'}</span>`}).join('<br>');
  $('#tab-vizinhanca').innerHTML=`<h2>Problemas de vizinhança</h2>
   <p class="muted" style="margin-top:0">Regra: macho (boi, garrote, touro) não faz divisa com fêmea (vaca, novilha). Desmama e tropa podem ao lado de qualquer gado. Situação de hoje, pelos vizinhos cadastrados na tela Pastos.</p>
   ${C2.length?`<p><b>${C2.length}</b> problema(s) encontrados.</p><div class="stack">${C2.map(c=>`<div class="card stack" style="border-left:4px solid var(--bad)">
     ${c.tipo==='mesmo'?`<div><b>${esc(nm(c.a))}</b>: macho e fêmea no mesmo pasto</div><div style="font-size:14px">${lote(c.la)}</div>`:
     `<div class="row" style="align-items:flex-start"><div style="font-size:14px"><div class="nm" style="font:700 16px var(--display)">${esc(nm(c.a))}</div>${lote(c.la)}</div><div style="font-size:14px"><div style="font:700 16px var(--display)">${esc(nm(c.b))}</div>${lote(c.lb)}</div></div>`}
     <div class="row">${[c.a,...(c.b?[c.b]:[])].map(id=>`<button class="btn sec" type="button" data-mov="${esc(id)}">Mudar gado do ${esc(nm(id))}</button>`).join('')}</div></div>`).join('')}</div>`
   :'<div class="note ok">Nenhum problema de vizinhança hoje.</div>'}`;
  document.querySelectorAll('[data-mov]').forEach(b=>b.onclick=()=>{mudPasto=b.dataset.mov;gadoModo='mudanca';go('mudanca')});
}

const localAuto=()=>Promise.race([pegarLocal().catch(()=>null),new Promise(ok=>setTimeout(()=>ok(null),20000))]);
const FOTO_LADO=1080, FOTO_DPI=200, FOTO_QUAL=0.8;
let _db=null;const _fotoMem={};
function fotoDb(){if(_db)return _db;_db=new Promise((ok,er)=>{try{const r=indexedDB.open('pastosMourao.fotos',1);r.onupgradeneeded=()=>r.result.createObjectStore('fotos');r.onsuccess=()=>ok(r.result);r.onerror=()=>er(r.error)}catch(e){er(e)}});return _db}
async function fotoPut(id,url){_fotoMem[id]=url;try{const db=await fotoDb();await new Promise((ok,er)=>{const t=db.transaction('fotos','readwrite');t.objectStore('fotos').put(url,id);t.oncomplete=ok;t.onerror=()=>er(t.error)})}catch(e){toast('Não foi possível guardar a foto neste aparelho. Exporte os dados antes de fechar.')}}
async function fotoGet(id){if(_fotoMem[id])return _fotoMem[id];try{const db=await fotoDb();return await new Promise(ok=>{const r=db.transaction('fotos').objectStore('fotos').get(id);r.onsuccess=()=>ok(r.result||null);r.onerror=()=>ok(null)})}catch(e){return null}}
// reduz para no máximo 1080 px no maior lado, JPEG, e grava 200 dpi no cabeçalho
async function compactarFoto(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((ok,er)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=er;i.src=url});
    const k=Math.min(1,FOTO_LADO/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    const blob=await new Promise(ok=>cv.toBlob(ok,'image/jpeg',FOTO_QUAL));
    const b=new Uint8Array(await blob.arrayBuffer());
    // cabeçalho JFIF: unidade em polegadas e densidade 200 x 200
    if(b[2]===0xFF&&b[3]===0xE0&&b[6]===0x4A&&b[7]===0x46){b[13]=1;b[14]=FOTO_DPI>>8;b[15]=FOTO_DPI&255;b[16]=FOTO_DPI>>8;b[17]=FOTO_DPI&255}
    let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
    return{url:'data:image/jpeg;base64,'+btoa(s),w,h,kb:Math.round(b.length/1024)}}
  finally{URL.revokeObjectURL(url)}}
function verFoto(url){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center;padding:12px';
  d.innerHTML=`<img src="${url}" style="max-width:100%;max-height:100%;border-radius:6px" alt="Foto da ocorrência">`;d.onclick=()=>d.remove();document.body.appendChild(d)}
// miniaturas: <img data-foto="id"> são preenchidas depois de desenhar a tela
function carregarFotos(raiz){(raiz||document).querySelectorAll('img[data-foto]').forEach(async im=>{const u=await fotoGet(im.dataset.foto);if(u){im.src=u;im.onclick=()=>verFoto(u)}else im.alt='foto não está neste aparelho'})}
const thumbs=ids=>(ids||[]).length?`<div class="thumbs">${ids.map(id=>`<img data-foto="${esc(id)}" alt="Foto">`).join('')}</div>`:'';
// seletor de fotos de um formulário: botão + prévias; devolve função que lê as fotos escolhidas
function seletorFotos(box){const sel=[];
  box.innerHTML=`<label class="btn sec" style="display:inline-flex">📷 Adicionar foto<input type="file" accept="image/*" multiple hidden></label><div class="thumbs"></div><div class="muted fMsg" style="font-size:12.5px"></div>`;
  const inp=box.querySelector('input'),th=box.querySelector('.thumbs'),msg=box.querySelector('.fMsg');
  const draw=()=>{th.innerHTML=sel.map((f,i)=>`<span class="th"><img src="${f.url}" alt="Foto ${i+1}"><button type="button" data-rm="${i}" aria-label="Remover foto">×</button></span>`).join('');
    th.querySelectorAll('img').forEach((im,i)=>im.onclick=()=>verFoto(sel[i].url));th.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sel.splice(+b.dataset.rm,1);draw()});
    msg.textContent=sel.length?`${sel.length} foto(s), ${sel.reduce((s,f)=>s+f.kb,0)} KB no total (compactadas para ${FOTO_LADO} px, ${FOTO_DPI} dpi).`:''};
  inp.onchange=async()=>{msg.textContent='Compactando...';for(const f of inp.files){try{sel.push(await compactarFoto(f))}catch(e){toast('Não consegui abrir uma das imagens')}}inp.value='';draw()};
  return async()=>{const ids=[];for(const f of sel){const id='f'+uid();await fotoPut(id,f.url);ids.push(id)}return ids}}
// localização pelo GPS do celular (funciona sem internet); o link abre no Google Maps
const agoraLocal=()=>{const d=new Date(),z=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}T${z(d.getHours())}:${z(d.getMinutes())}`};
const mapsUrl=l=>`https://www.google.com/maps?q=${l.lat},${l.lng}`;
const localHtml=l=>l?`<a href="${mapsUrl(l)}" target="_blank" rel="noopener">📍 Ver no Google Maps</a> <span class="muted" style="font-size:12.5px">(${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}${l.prec?', ±'+Math.round(l.prec)+' m':''})</span>`:'';
function pegarLocal(){return new Promise((ok,er)=>{if(!navigator.geolocation)return er(new Error('Este navegador não oferece localização.'));
  navigator.geolocation.getCurrentPosition(p=>ok({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),prec:p.coords.accuracy}),
    e=>er(new Error(e.code===1?'Permissão de localização negada. Libere a localização para este app nas configurações do navegador.':e.code===3?'O GPS demorou a responder. Tente de novo em local aberto.':'Não foi possível pegar a localização. Ligue o GPS do celular.')),
    {enableHighAccuracy:true,timeout:30000,maximumAge:60000})})}

  $('#fNasc').onsubmit=e=>{e.preventDefault();const w=parseFloat($('#nPeso').value),g=parseFloat($('#nGmd').value),wp=parseFloat($('#nPesoP').value),gp=parseFloat($('#nGmdP').value);
    if(!(w>=10&&w<=60)||!(g>=0&&g<=2)||!(wp>=10&&wp<=80)||!(gp>=0&&gp<=2)){toast('Confira os pesos e os GMD (0 a 2)');return}
    S.config={...S.config,pesoNasc:w,gmdNasc:g,pesoNascPotro:wp,gmdNascPotro:gp,alterado:Date.now()};registrar('config',null,`Nascimento: bezerro ${w} kg, GMD ${g}; potro ${wp} kg, GMD ${gp}`);msg('Salvo')};
  $('#fEpPar').onsubmit=e=>{e.preventDefault();const par={};for(const [k] of EPOCAS){const u=parseFloat($('#epU_'+k).value),d=parseInt($('#epD_'+k).value);if(!(u>=0.2&&u<=5)||!(d>=5&&d<=180)){toast('UA/ha de 0,2 a 5 e descanso de 5 a 180 dias');return}par[k]={ua:u,desc:d}}
    S.config={...S.config,epocaPar:par,alterado:Date.now()};_perCache=null;registrar('config',null,'Épocas: '+EPOCAS.map(([k,n])=>`${n} ${par[k].ua} UA/ha, ${par[k].desc} d`).join('; '));msg('Salvo')};
  $('#fEpoca').onsubmit=e=>{e.preventDefault();const ep=$('#ePocaS').value,d=$('#ePocaD').value;if(!ep||!d){toast('Escolha a época e a data');return}
    S.config={...S.config,epocas:[...(S.config.epocas||[]),{data:d,epoca:ep,criado:Date.now()}],alterado:Date.now()};_perCache=null;registrar('config',d,`Época: ${EP(ep).nome} a partir de ${br(d)}`);msg(`${EP(ep).nome} a partir de ${br(d)}`)};
  bindGroup('scVer');
  $('#fSupCfg').onsubmit=e=>{e.preventDefault();const tr=parseInt($('#scTr').value),sv=$('#scSede').value.trim(),pc=parseInt($('#scPct').value),old=supCfg();
    if(!(tr>0)||!(pc>=1&&pc<=100)||(sv!==''&&!(+sv>=0))){toast('Confira os números');return}
    const sede=sv===''?null:+sv,c={trator:tr,sede,sedeData:sede===null?null:(sede===old.sede?old.sedeData:hoje()),sedeTs:sede===null?null:(sede===old.sede?old.sedeTs:Date.now()),divPct:pc,divSoAdm:groupVal('scVer')!=='todos'};
    S.config={...S.config,supCfg:c,alterado:Date.now()};registrar('config',null,`Suplementação: trator ${tr} sacos, sede ${sede===null?'não informada':sede+' sacos'}, divergência ${pc}% (${c.divSoAdm?'só admin':'todos'})`);msg('Salvo')};
  $('#fRend').onsubmit=e=>{e.preventDefault();const ok=x=>x>=40&&x<=65,f=parseFloat($('#rF').value),ac=parseFloat($('#rAc').value),m=rendTab().m.map((_,i)=>[parseInt($('#rA'+i).value),parseFloat($('#rM'+i).value)]);
    if(!ok(f)||!ok(ac)||m.some(([a,r])=>!ok(r)||!(a>0))){toast('Rendimentos de 40% a 65% e pesos preenchidos');return}
    if(m.some(([a],i)=>i&&a<=m[i-1][0])){toast('Os pesos das faixas precisam ir aumentando');return}
    S.config={...S.config,rend:{f,m,acima:ac},alterado:Date.now()};registrar('config',null,`Rendimento de carcaça: fêmeas ${f}%; machos ${m.map(([a,r])=>'até '+a+' kg '+r+'%').join(', ')}, acima ${ac}%`);msg('Salvo')};
  $('#fDiasG').onsubmit=e=>{e.preventDefault();const n=parseInt($('#gDias').value);if(!(n>=1&&n<=120)){toast('Informe de 1 a 120 dias');return}
    S.config={...S.config,diasPassado:n,alterado:Date.now()};registrar('config',null,`Dias que o capim fica passado depois da altura 5: ${n}`);msg(`Salvo: ${n} dias`)}}

  $('#tab-mais').innerHTML=`<h2>Mais</h2><div class="menu">
   <button data-go="usuario"><span>Usuário<small>Trocar minha senha</small></span></button>

   ${pode('historico')?'':'<!--'}<button data-go="historico"><span>Histórico do pasto<small>Leituras, consumo e ritmo de cada pasto</small></span></button>${pode('historico')?'':'-->'}
   ${pode('dados')?'':'<!--'}<button data-go="dados"><span>Dados e sincronização<small>Enviar dados, cópia de segurança, juntar dados de outro celular</small></span></button>${pode('dados')?'':'-->'}
   <button data-go="adm"><span>Administrador<small>Rebanho, Pastos, Configurações, Registro do sistema, Apagar dados</small></span>${isAdmin()?'<span class="chip c-ok">ativo</span>':'🔒'}</button>

// ---------- navegação ----------
const R={usuario:renderUsuario,meus:renderMeus,admin:renderAdmin,adm:renderAdm,registro:renderRegistro,apagar:renderApagar,supl:renderSupl,suplementos:renderSuplementos,sinc:renderSinc,painel:renderPainel,leitura:renderLeitura,mudanca:renderGado,historico:renderHistorico,dados:renderDados,rebanho:renderRebanho,ocorrencias:renderOcorrencias,vizinhanca:renderVizinhanca,pastos:renderPastos,mais:renderMais};
const SUB={usuario:'mais',meus:'mais',admin:'mais',adm:'mais',registro:'mais',apagar:'mais',sinc:'mais',historico:'mais',dados:'mais',vizinhanca:'mais',pastos:'mais',rebanho:'mais',suplementos:'mais'};
const NAV_FR={painel:1,leitura:1,mudanca:.9,supl:1.45,ocorrencias:1.3,mais:.9};
function ajustaNav(){const B=[...document.querySelectorAll('nav.tabs button')];B.forEach(b=>b.hidden=!podeTela(b.dataset.tab));
  $('#nav').style.gridTemplateColumns=B.filter(b=>!b.hidden).map(b=>(NAV_FR[b.dataset.tab]||1)+'fr').join(' ')}
function go(t,livre){if(!SES)return mostrarLogin();if(t==='sinc'){t='dados';livre=true}
  ajustaNav();if(!livre&&!podeTela(t)){const ok=['painel','leitura','mudanca','supl','ocorrencias'].find(podeTela);t=ok||'mais'}document.querySelectorAll('main>section').forEach(s=>s.hidden=s.id!=='tab-'+t);
  const nt=SUB[t]||t;document.querySelectorAll('nav.tabs button').forEach(b=>{b.removeAttribute('aria-current');if(b.dataset.tab===nt)b.setAttribute('aria-current','page')});
  if(t==='pastos'&&!SUB.__keep)editPasto=null;
  if(t==='mudanca'&&!gadoPre)morteP=morteCat=null;
  R[t]();window.scrollTo(0,0);try{localStorage.setItem(KEY+'.tab',t)}catch(e){}}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
$('#btResumo').onclick=enviarResumo;$('#btSair').onclick=()=>{if(confirm('Sair e trocar de usuário?'))sair()};$('#btSinc').onclick=()=>{dadosSincAgora=!!sincCfg().url;go('dados',true)};$('#hdrWho').onclick=()=>go('meus');
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if(SES&&(SES.id==='admin'||(usuario(SES.id)&&usuario(SES.id).ativo!==false)))mostrarApp();else{SES=null;mostrarLogin()}
setInterval(()=>{if(SES)atualizaTopo()},60000);
</script>
